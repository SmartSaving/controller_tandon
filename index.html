<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#06131c">
<title>Controller Tandon</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#06131c;--panel:#0c1f2c;--panel2:#0f2738;--line:#1c3a4d;
  --text:#e9f5fa;--muted:#8fabb8;--water:#2fb6f2;--water2:#7fe0ff;
  --ok:#3ddc97;--warn:#ffbf5a;--bad:#ff6170;--r:18px;
}
*{box-sizing:border-box}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{margin:0;color:var(--text);font-family:'Plus Jakarta Sans',system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif}
body{background:radial-gradient(1100px 560px at 85% -10%,#123a52 0,transparent 60%),var(--bg);min-height:100vh;padding-bottom:86px}
button{font:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--water2);outline-offset:2px}
.app{max-width:1080px;margin:0 auto;padding:16px}

/* header */
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:14px}
.brand{display:flex;gap:12px;align-items:center;min-width:0}
.logo{flex:none;width:44px;height:44px;border-radius:14px;display:grid;place-items:center;background:linear-gradient(160deg,#1a5a7d,#0d2c3e);font-size:22px}
h1{font-size:19px;margin:0}
.brand p{margin:2px 0 0;color:var(--muted);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pill{display:flex;align-items:center;gap:8px;padding:8px 12px;border-radius:999px;border:1px solid var(--line);background:var(--panel);font-size:13px;font-weight:600;white-space:nowrap}
.pill i{width:9px;height:9px;border-radius:50%;background:var(--warn)}
.pill.ok i{background:var(--ok);box-shadow:0 0 0 4px rgba(61,220,151,.15)}
.pill.bad i{background:var(--bad)}

/* nav */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;display:grid;grid-template-columns:repeat(5,1fr);background:rgba(6,19,28,.96);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px))}
.tabs button{background:none;border:0;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 2px;border-radius:12px;font-size:11.5px;font-weight:600}
.tabs .ic{font-size:20px;line-height:1}
.tabs button.active{color:var(--text);background:var(--panel2)}
@media(min-width:860px){
  body{padding-bottom:0}
  .tabs{position:static;display:flex;gap:6px;background:none;border:0;padding:0;margin-bottom:18px}
  .tabs button{flex-direction:row;gap:8px;padding:10px 16px;font-size:14px;border:1px solid transparent}
  .tabs button.active{border-color:var(--line)}
}

/* layout */
.page{display:none}
.page.active{display:block}
@media(min-width:860px){
  #pg-home.active{display:grid;grid-template-columns:1.45fr 1fr;gap:14px;align-items:start}
  #pg-home .alarm{grid-column:1/-1}
  #pg-home .card{margin-bottom:0}
}
.card{background:linear-gradient(160deg,var(--panel2),var(--panel));border:1px solid var(--line);border-radius:var(--r);padding:18px;margin-bottom:14px}
h2{font-size:18px;margin:0 0 4px}
h3{font-size:15px;margin:0 0 10px}
.muted{color:var(--muted);font-size:14px;margin:0;line-height:1.5}

.btn{border:0;border-radius:14px;padding:15px 16px;font-weight:800;font-size:17px;color:#04131b}
.btn:disabled{opacity:.3;cursor:not-allowed}
.btn.on{background:var(--ok)}
.btn.off{background:var(--bad);color:#fff}
.btn.primary{background:var(--water);width:100%;margin-top:16px}
.btn.small{padding:9px 14px;font-size:14px;background:var(--warn);margin-top:10px}
.note{min-height:1.3em;font-size:14px;color:var(--muted);margin:10px 0 0}
.note.err{color:var(--bad)}
.note.good{color:var(--ok)}

/* alarm */
.alarm{display:flex;gap:12px;align-items:flex-start;background:rgba(255,97,112,.12);border:1px solid rgba(255,97,112,.55);border-radius:var(--r);padding:14px 16px;margin-bottom:14px}
.alarm[hidden]{display:none}
.alarm .ai{font-size:26px;line-height:1}
.alarm b{display:block;font-size:15px;line-height:1.45}

/* hero tank */
.hero{display:grid;grid-template-columns:auto 1fr;gap:24px;align-items:center}
@media(max-width:540px){.hero{grid-template-columns:1fr;justify-items:center;text-align:center}.facts{text-align:left;width:100%}}
.tank{position:relative;width:150px;height:240px;border:4px solid #b8d8e3;border-top-width:10px;border-radius:30px 30px 22px 22px;overflow:hidden;background:#071a25}
.water{position:absolute;left:0;right:0;bottom:0;height:0;background:linear-gradient(to top,#1478aa,var(--water));transition:height 1.2s cubic-bezier(.2,.8,.2,1)}
.wave{position:absolute;top:-6px;left:-50%;width:200%;height:7px;background:radial-gradient(ellipse 22px 7px at 50% 100%,var(--water) 98%,transparent 100%) 0 0/40px 7px repeat-x;animation:wave 3s linear infinite}
.water.empty .wave{display:none}
@keyframes wave{to{transform:translateX(40px)}}
.pct{position:absolute;inset:0;display:grid;place-items:center;font-size:34px;font-weight:800;text-shadow:0 2px 10px rgba(0,0,0,.65);z-index:3}
.mark{position:absolute;left:0;right:0;border-top:2px dashed var(--ok);z-index:2;transition:bottom .6s}
.mark span{position:absolute;right:4px;top:-19px;font-size:10.5px;font-weight:800;color:var(--ok);background:rgba(6,19,28,.85);padding:1px 6px;border-radius:6px}
.mark.start{border-color:var(--warn)}
.mark.start span{color:var(--warn);top:3px}
.mark[hidden]{display:none}
.readout{min-width:0;width:100%}
.readout .label{color:var(--muted);font-weight:600}
.liters{font-size:54px;font-weight:800;line-height:1.05;letter-spacing:-1px;margin-top:2px}
.liters small{font-size:22px;color:var(--muted);letter-spacing:0}
.state{display:inline-block;margin:12px 0 8px;padding:7px 13px;border-radius:999px;font-weight:700;font-size:15px;background:rgba(61,220,151,.14);color:var(--ok)}
.state.warn{background:rgba(255,191,90,.14);color:var(--warn)}
.state.bad{background:rgba(255,97,112,.14);color:var(--bad)}
.state.info{background:rgba(47,182,242,.15);color:var(--water2)}
.estimate{font-size:15px;color:var(--muted)}
.estimate b{color:var(--text)}
.bar{height:8px;background:#163243;border-radius:9px;overflow:hidden;margin:14px 0}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--water),var(--water2));transition:width 1.2s}
.facts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:0}
.facts div{background:rgba(255,255,255,.03);border:1px solid var(--line);border-radius:12px;padding:9px 11px}
dt{font-size:12px;color:var(--muted)}
dd{margin:2px 0 0;font-weight:700}

/* pump card */
.pumpTop{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.pumpState{display:flex;align-items:center;gap:12px;font-size:21px;font-weight:800}
.lamp{width:18px;height:18px;border-radius:50%;background:#3a4f5b;flex:none}
.lamp.on{background:var(--ok);box-shadow:0 0 0 6px rgba(61,220,151,.18),0 0 18px var(--ok)}
.seg{display:flex;background:#08202d;border:1px solid var(--line);border-radius:13px;padding:3px}
.seg button{border:0;background:none;color:var(--muted);padding:9px 14px;border-radius:10px;font-weight:700}
.seg button.active{background:var(--water);color:#04131b}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}

/* tank page */
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0}
.chip{border:1px solid var(--line);background:#08202d;color:var(--text);padding:10px 15px;border-radius:999px;font-weight:700}
.chip.active{background:var(--water);color:#04131b;border-color:transparent}
.models{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px}
.model{text-align:left;border:1px solid var(--line);background:#08202d;color:var(--text);border-radius:14px;padding:12px}
.model b{display:block;font-size:15px}
.model span{color:var(--muted);font-size:13px}
.model.active{border-color:var(--water);box-shadow:inset 0 0 0 1px var(--water)}
.field{display:block;margin-top:12px}
.field>span{display:block;font-size:13.5px;color:var(--muted);margin-bottom:6px;font-weight:600}
input[type=number]{width:100%;background:#061822;border:1px solid var(--line);color:var(--text);border-radius:12px;padding:12px;font:inherit;font-size:18px;font-weight:700}
.hint{font-size:12.5px;color:var(--muted);margin-top:6px;line-height:1.45}
.summary{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.summary div{background:rgba(255,255,255,.03);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.summary b{display:block;font-size:17px}
.summary span{font-size:12.5px;color:var(--muted)}

/* threshold */
.thr{margin-top:14px;padding:14px;border:1px solid var(--line);border-radius:14px;background:rgba(255,255,255,.02)}
.thrLabel{display:flex;align-items:center;gap:9px;font-weight:700;margin-bottom:10px}
.dot{width:12px;height:12px;border-radius:50%;flex:none}
.dot.start{background:var(--warn)}
.dot.stop{background:var(--ok)}
.pair{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center}
.unit{position:relative;display:block}
.unit input{padding-right:42px}
.unit em{position:absolute;right:13px;top:50%;transform:translateY(-50%);font-style:normal;color:var(--muted);font-weight:800}
.eq{color:var(--muted);font-weight:800}
input[type=range]{width:100%;margin-top:14px;accent-color:var(--water);height:28px}
.preview{position:relative;height:18px;border-radius:9px;background:#163243;margin-top:16px;overflow:hidden}
.preview i{position:absolute;top:0;bottom:0;background:rgba(47,182,242,.4)}
.preview .s,.preview .e{position:absolute;top:0;bottom:0;width:3px}
.preview .s{background:var(--warn)}
.preview .e{background:var(--ok)}
.inline{display:flex;align-items:center;gap:10px}
.inline input{max-width:110px}

/* history */
.totals{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px}
@media(max-width:540px){.totals{grid-template-columns:1fr}}
.tot{border:1px solid var(--line);border-radius:14px;padding:12px 14px;background:rgba(255,255,255,.02)}
.tot .k{color:var(--muted);font-size:13px;font-weight:700}
.tot .v{font-size:27px;font-weight:800;margin:4px 0}
.tot .s{font-size:13px;color:var(--muted);line-height:1.5}
.chart{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;align-items:end;height:190px;margin-top:8px}
.col{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:6px;font-size:12px;color:var(--muted)}
.col i{width:100%;max-width:40px;border-radius:8px 8px 3px 3px;background:linear-gradient(to top,#1478aa,var(--water));min-height:4px;transition:height .8s}
.col.today i{background:linear-gradient(to top,#24966a,var(--ok))}
.col b{color:var(--text);font-size:11px}
.events{list-style:none;padding:0;margin:0;display:grid;gap:8px}
.events li{display:flex;gap:10px;align-items:center;padding:10px 12px;border-radius:12px;background:rgba(255,255,255,.03);border:1px solid var(--line)}
.events .ei{font-size:18px;flex:none}
.events .et{flex:1;font-weight:600;font-size:14px;min-width:0}
.events .et small{display:block;color:var(--muted);font-weight:500}
.events time{font-size:12px;color:var(--muted);white-space:nowrap}

/* language */
.group{margin-top:18px;font-size:13px;color:var(--muted);font-weight:700}
.langs{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:8px;margin-top:8px}
.lang{display:flex;flex-direction:column;align-items:flex-start;border:1px solid var(--line);background:#08202d;color:var(--text);border-radius:14px;padding:12px 14px;text-align:left}
.lang b{font-size:16px}
.lang span{color:var(--muted);font-size:13px}
.lang.active{border-color:var(--water);box-shadow:inset 0 0 0 1px var(--water)}

@media(prefers-reduced-motion:reduce){.wave{animation:none}.water,.bar i,.col i,.mark{transition:none}}
</style>
</head>
<body>
<div class="app">

<header class="top">
  <div class="brand">
    <div class="logo" aria-hidden="true">💧</div>
    <div><h1>Controller Tandon</h1><p id="tankLabel">—</p></div>
  </div>
  <div class="pill wait" id="connPill"><i></i><span id="connText"></span></div>
</header>

<nav class="tabs" id="tabs">
  <button data-page="home" class="active"><span class="ic">🏠</span><span data-i18n="nav_home"></span></button>
  <button data-page="tank"><span class="ic">🛢️</span><span data-i18n="nav_tank"></span></button>
  <button data-page="pump"><span class="ic">⚙️</span><span data-i18n="nav_pump"></span></button>
  <button data-page="history"><span class="ic">📊</span><span data-i18n="nav_history"></span></button>
  <button data-page="lang"><span class="ic">🌐</span><span data-i18n="nav_lang"></span></button>
</nav>

<main>
<!-- ================= BERANDA ================= -->
<section id="pg-home" class="page active">
  <div class="alarm" id="alarmBox" hidden>
    <div class="ai">⚠️</div>
    <div><b id="alarmText"></b><button class="btn small" id="alarmReset" data-i18n="reset_alarm"></button></div>
  </div>

  <div class="card hero">
    <div class="tank" aria-hidden="true">
      <div class="water empty" id="water"><div class="wave"></div></div>
      <div class="mark" id="markStop" hidden><span></span></div>
      <div class="mark start" id="markStart" hidden><span></span></div>
      <div class="pct" id="pctBig">—</div>
    </div>
    <div class="readout">
      <div class="label" data-i18n="water_in_tank"></div>
      <div class="liters"><span id="litersBig">—</span> <small>L</small></div>
      <div class="muted" id="ofCap"></div>
      <div class="state info" id="stateText"></div>
      <div class="estimate"><span data-i18n="estimate"></span>: <b id="estText">—</b></div>
      <div class="bar"><i id="barFill"></i></div>
      <dl class="facts">
        <div><dt data-i18n="empty_space"></dt><dd id="emptyL">—</dd></div>
        <div><dt data-i18n="level"></dt><dd id="levelCm">—</dd></div>
        <div><dt data-i18n="last_seen"></dt><dd id="lastSeen">—</dd></div>
        <div><dt data-i18n="signal"></dt><dd id="rssi">—</dd></div>
      </dl>
    </div>
  </div>

  <div class="card">
    <div class="pumpTop">
      <div class="pumpState"><span class="lamp" id="lamp"></span><span id="pumpText">—</span></div>
      <div class="seg" role="group">
        <button id="modeAuto" data-i18n="mode_auto"></button>
        <button id="modeManual" data-i18n="mode_manual"></button>
      </div>
    </div>
    <p class="muted" id="modeDesc"></p>
    <div class="btns">
      <button class="btn on" id="btnOn" data-i18n="btn_on"></button>
      <button class="btn off" id="btnOff" data-i18n="btn_off"></button>
    </div>
    <p class="note" id="cmdNote"></p>
  </div>
</section>

<!-- ================= TANDON ================= -->
<section id="pg-tank" class="page">
  <div class="card">
    <h2 data-i18n="tank_title"></h2>
    <p class="muted" data-i18n="tank_desc"></p>
    <div class="chips" id="brandChips"></div>
    <div class="models" id="modelList"></div>
    <div id="customBox" hidden>
      <label class="field"><span data-i18n="capacity"></span><input type="number" id="customCap" inputmode="numeric" min="10" placeholder="1200"></label>
      <label class="field"><span data-i18n="height"></span><input type="number" id="customHeight" inputmode="decimal" min="40" placeholder="160"></label>
      <p class="hint" data-i18n="height_hint"></p>
    </div>
  </div>

  <div class="card">
    <h3 data-i18n="tank_selected"></h3>
    <div class="summary" id="tankSummary"></div>
    <label class="field"><span data-i18n="gap"></span><input type="number" id="gapInput" inputmode="decimal" min="20" max="60"></label>
    <p class="hint" data-i18n="gap_hint"></p>
    <button class="btn primary" id="saveTank" data-i18n="save"></button>
    <p class="note" id="tankNote"></p>
  </div>
</section>

<!-- ================= ATUR POMPA ================= -->
<section id="pg-pump" class="page">
  <div class="card">
    <h2 data-i18n="auto_title"></h2>
    <p class="muted" id="usableInfo"></p>

    <div class="thr">
      <div class="thrLabel"><span class="dot start"></span><span data-i18n="start_at"></span></div>
      <div class="pair">
        <label class="unit"><input type="number" id="startPct" inputmode="decimal" min="5" max="90" step="1"><em>%</em></label>
        <span class="eq">=</span>
        <label class="unit"><input type="number" id="startL" inputmode="numeric" min="0" step="10"><em>L</em></label>
      </div>
      <input type="range" id="startRange" min="5" max="90" step="1" aria-label="start">
    </div>

    <div class="thr">
      <div class="thrLabel"><span class="dot stop"></span><span data-i18n="stop_at"></span></div>
      <div class="pair">
        <label class="unit"><input type="number" id="stopPct" inputmode="decimal" min="15" max="95" step="1"><em>%</em></label>
        <span class="eq">=</span>
        <label class="unit"><input type="number" id="stopL" inputmode="numeric" min="0" step="10"><em>L</em></label>
      </div>
      <input type="range" id="stopRange" min="15" max="95" step="1" aria-label="stop">
    </div>

    <div class="preview" aria-hidden="true"><i id="pvBand"></i><span class="s" id="pvS"></span><span class="e" id="pvE"></span></div>
    <p class="hint" id="pvText"></p>
  </div>

  <div class="card">
    <h3 data-i18n="dry_title"></h3>
    <p class="muted" data-i18n="dry_explain"></p>
    <label class="field"><span data-i18n="dry_desc"></span>
      <div class="inline"><input type="number" id="dryMin" min="3" max="60" inputmode="numeric"><b data-i18n="minutes"></b></div>
    </label>
    <button class="btn primary" id="saveAuto" data-i18n="save"></button>
    <p class="note" id="autoNote"></p>
  </div>
</section>

<!-- ================= RIWAYAT ================= -->
<section id="pg-history" class="page">
  <div class="card">
    <h2 data-i18n="history_title"></h2>
    <div class="totals">
      <div class="tot"><div class="k" data-i18n="today"></div><div class="v" id="uToday">—</div><div class="s" id="sToday"></div></div>
      <div class="tot"><div class="k" data-i18n="week"></div><div class="v" id="uWeek">—</div><div class="s" id="sWeek"></div></div>
      <div class="tot"><div class="k" data-i18n="month"></div><div class="v" id="uMonth">—</div><div class="s" id="sMonth"></div></div>
    </div>
  </div>
  <div class="card">
    <h3 data-i18n="chart_7d"></h3>
    <div class="chart" id="chart"></div>
  </div>
  <div class="card">
    <h3 data-i18n="events"></h3>
    <ul class="events" id="events"></ul>
  </div>
</section>

<!-- ================= BAHASA ================= -->
<section id="pg-lang" class="page">
  <div class="card">
    <h2 data-i18n="lang_title"></h2>
    <p class="muted" data-i18n="lang_desc"></p>
    <div class="group" data-i18n="lang_regional"></div>
    <div class="langs" id="langRegional"></div>
    <div class="group" data-i18n="lang_national"></div>
    <div class="langs" id="langNational"></div>
  </div>
</section>
</main>
</div>

let LANG = 'id';
try { LANG = localStorage.getItem('tandonLang') || 'bjn'; } catch(e) { LANG = 'bjn'; }

function t(key, vars){
  let s = (I18N[LANG] && I18N[LANG][key] !== undefined) ? I18N[LANG][key]
        : (I18N.id[key] !== undefined ? I18N.id[key] : key);
  if (vars && typeof s === 'string') for (const k in vars) s = s.split('{'+k+'}').join(vars[k]);
  return s;
}

// =====================================================================
// UTIL
// =====================================================================
const $ = id => document.getElementById(id);
const nf = (v, d=0) => Number(v).toLocaleString('id-ID',{minimumFractionDigits:d,maximumFractionDigits:d});
const clamp = (v,a,b) => Math.max(a, Math.min(b, v));
const dev = 'device_id=eq.' + encodeURIComponent(DEVICE_ID);

async function api(path, {method='GET', body, prefer} = {}){
  const headers = {apikey:SUPABASE_KEY, Authorization:'Bearer '+SUPABASE_KEY, Accept:'application/json'};
  if (body !== undefined) headers['Content-Type'] = 'application/json';
  if (prefer) headers.Prefer = prefer;
  const res = await fetch(SUPABASE_URL + '/rest/v1/' + path, {
    method, headers, cache:'no-store', body: body !== undefined ? JSON.stringify(body) : undefined
  });
  const text = await res.text();
  if (!res.ok) throw new Error(res.status + ' ' + text);
  return text ? JSON.parse(text) : null;
}

function note(id, msg, kind){
  const el = $(id); el.textContent = msg || '';
  el.className = 'note' + (kind ? ' ' + kind : '');
}

function usableOf(cap, h, gap){ return h > gap ? cap * (h - gap) / h : 0; }
function cfgUsable(){ const c = S.cfg; return c ? usableOf(+c.capacity_liters, +c.tank_height_cm, +c.full_gap_cm) : 0; }
function fmtDuration(min){
  min = Math.round(min);
  if (min < 60) return min + ' ' + t('minutes_short');
  return nf(Math.floor(min/60)) + ' ' + t('hours_short') + ' ' + (min%60) + ' ' + t('minutes_short');
}
function witaDate(d){ return d.toLocaleDateString('en-CA',{timeZone:'Asia/Makassar'}); }

// =====================================================================
// STATE
// =====================================================================
const S = {
  data:null, cfg:null, lastStamp:null, lastChange:0,
  pending:null, estimate:null, usage:[], events:[],
  draft:null, brand:null, dirtyAuto:false, dirtyGap:false
};
const isOnline = () => S.lastChange && (Date.now() - S.lastChange < OFFLINE_MS);

// =====================================================================
// BERANDA
// =====================================================================
function renderHome(){
  const d = S.data, c = S.cfg, online = isOnline();

  const pill = $('connPill');
  pill.className = 'pill ' + (!d ? 'wait' : online ? 'ok' : 'bad');
  $('connText').textContent = !d ? t('connecting') : online ? t('online') : t('offline');

  if (c) $('tankLabel').textContent = `${c.tank_brand || ''} ${c.tank_model || ''}, ${nf(c.capacity_liters)} L`;

  const valid = d && !d.sensor_error && d.level_percent != null;
  const pct = valid ? clamp(+d.level_percent, 0, 100) : null;
  const usable = valid && d.usable_liters ? +d.usable_liters : cfgUsable();
  const vol = valid ? +d.volume_liters : null;

  const water = $('water');
  water.style.height = (pct ?? 0) + '%';
  water.classList.toggle('empty', !pct || pct < 1);
  $('pctBig').textContent = pct == null ? '—' : nf(pct) + '%';
  $('litersBig').textContent = vol == null ? '—' : nf(vol);
  $('ofCap').textContent = usable ? t('of_capacity', {cap: nf(usable)}) : '';
  $('barFill').style.width = (pct ?? 0) + '%';
  $('emptyL').textContent = vol == null ? '—' : nf(Math.max(0, usable - vol)) + ' L';
  $('levelCm').textContent = valid ? nf(d.level_cm, 1) + ' cm' : '—';
  $('lastSeen').textContent = S.lastChange ? new Date(S.lastChange).toLocaleTimeString('id-ID',{hour:'2-digit',minute:'2-digit',second:'2-digit'}) : '—';
  $('rssi').textContent = d && d.wifi_rssi != null ? d.wifi_rssi + ' dBm' : '—';

  // garis batas nyala/mati di gambar tandon
  const auto = c && c.mode === 'auto';
  for (const [id, val, key] of [['markStart', c && c.start_percent, 'mk_start'], ['markStop', c && c.stop_percent, 'mk_stop']]){
    const m = $(id);
    m.hidden = !auto;
    if (auto){ m.style.bottom = val + '%'; m.firstElementChild.textContent = t(key, {p: nf(val)}); }
  }

  // status dalam kalimat sederhana
  let st = 'info', txt;
  if (!d) txt = t('waiting');
  else if (!online) { st = 'bad'; txt = t('device_offline'); }
  else if (d.sensor_error) { st = 'bad'; txt = t('sensor_err'); }
  else if (d.pump_on) { st = 'info'; txt = t('status_filling'); }
  else if (c && pct >= Math.min(95, c.stop_percent)) { st = 'ok'; txt = t('status_full'); }
  else if (pct <= Math.max(15, c ? c.start_percent : 15)) { st = 'warn'; txt = t('status_low'); }
  else { st = 'ok'; txt = t('status_ok'); }
  const se = $('stateText'); se.className = 'state ' + (st === 'ok' ? '' : st); se.textContent = txt;

  $('estText').textContent = estimateText(online, d, vol);

  // pompa
  const on = !!(d && d.pump_on);
  $('lamp').classList.toggle('on', on && online);
  $('pumpText').textContent = !d ? '—' : (on ? t('pump_on') : t('pump_off'));
  $('modeAuto').classList.toggle('active', !!auto);
  $('modeManual').classList.toggle('active', !!c && !auto);
  $('modeDesc').textContent = !c ? '' : auto
      ? t('mode_auto_desc', {start: nf(c.start_percent)+'% ('+nf(c.start_percent/100*cfgUsable())+' L)', stop: nf(c.stop_percent)+'% ('+nf(c.stop_percent/100*cfgUsable())+' L)'})
      : t('mode_manual_desc');
  const lock = !c || auto || !online || !!S.pending;
  $('btnOn').disabled = lock || on;
  $('btnOff').disabled = lock || !on;

  // alarm
  const box = $('alarmBox');
  const alarm = d && online ? d.alarm : '';
  box.hidden = !alarm;
  if (alarm){
    $('alarmText').textContent = t('alarm_' + alarm);
    $('alarmReset').hidden = alarm === 'SENSOR';
  }
}

function estimateText(online, d, vol){
  if (!online || !d || vol == null) return '—';
  if (d.pump_on) return t('est_filling');
  const e = S.estimate;
  if (!e || e.kind === 'unknown') return t('est_unknown');
  if (e.kind === 'long') return t('est_long');
  const h = vol / e.rate;
  if (h > 48) return t('est_long');
  if (h >= 24) return t('est_days', {d: nf(h/24, 1)});
  return t('est_hours', {h: nf(h, h < 10 ? 1 : 0)});
}

async function pollData(){
  try{
    const rows = await api(T_DATA + '?select=*&' + dev);
    const d = rows && rows[0];
    if (d){
      if (d.updated_at !== S.lastStamp){
        const first = S.lastStamp === null;
        S.lastStamp = d.updated_at;
        S.lastChange = first ? Math.min(Date.now(), Date.parse(d.updated_at)) : Date.now();
      }
      S.data = d;
      checkPending();
    }
  }catch(e){ console.warn('data:', e.message); }
  renderHome();
}

async function sendCommand(on){
  if (!S.cfg || S.cfg.mode !== 'manual'){ note('cmdNote', t('manual_only'), 'err'); return; }
  note('cmdNote', t('sending'));
  try{
    const seq = await api('rpc/tandon_send_command', {method:'POST', body:{p_device:DEVICE_ID, p_on:on}});
    S.pending = {seq:Number(seq), on, since:Date.now()};
    note('cmdNote', t('waiting_device'));
  }catch(e){
    S.pending = null;
    note('cmdNote', t('cmd_fail'), 'err');
  }
  renderHome();
}

function checkPending(){
  const p = S.pending;
  if (!p || !S.data) return;
  if (Number(S.data.applied_cmd_seq) >= p.seq && S.data.pump_on === p.on){
    S.pending = null; note('cmdNote', '');
  } else if (Number(S.data.applied_cmd_seq) >= p.seq && Date.now() - p.since > 6000){
    S.pending = null; note('cmdNote', '');   // diterima tapi ditahan pengaman; alarm akan tampil
  } else if (Date.now() - p.since > 15000){
    S.pending = null; note('cmdNote', t('cmd_timeout'), 'err');
  }
}

async function setMode(mode){
  if (!S.cfg || S.cfg.mode === mode) return;
  const prev = S.cfg.mode;
  S.cfg.mode = mode; renderHome();
  try{
    await api(T_CFG + '?' + dev, {method:'PATCH', body:{mode}, prefer:'return=minimal'});
    note('cmdNote', '');
  }catch(e){
    S.cfg.mode = prev; note('cmdNote', t('save_fail'), 'err'); renderHome();
  }
}

async function resetAlarm(){
  try{
    await api('rpc/tandon_reset_alarm', {method:'POST', body:{p_device:DEVICE_ID}});
    note('cmdNote', t('waiting_device'));
  }catch(e){ note('cmdNote', t('save_fail'), 'err'); }
}

// =====================================================================
// PENGATURAN (dibaca dari Supabase)
// =====================================================================
async function loadConfig(force){
  try{
    const rows = await api(T_CFG + '?select=*&' + dev);
    if (!rows || !rows[0]) return;
    S.cfg = rows[0];
    if (force || !S.dirtyAuto) fillAuto();
    if (force || !S.dirtyGap) $('gapInput').value = S.cfg.full_gap_cm;
    if (!S.brand) S.brand = TANKS[S.cfg.tank_brand] ? S.cfg.tank_brand : CUSTOM;
    renderTankPage();
    renderHome();
  }catch(e){ console.warn('config:', e.message); }
}

// =====================================================================
// HALAMAN TANDON
// =====================================================================
function tankChoice(){
  if (S.draft) return S.draft;
  const c = S.cfg;
  return c ? {brand:c.tank_brand, model:c.tank_model, cap:+c.capacity_liters, height:+c.tank_height_cm} : null;
}

function renderTankPage(){
  const chips = $('brandChips'); chips.innerHTML = '';
  for (const b of [...Object.keys(TANKS), CUSTOM]){
    const el = document.createElement('button');
    el.className = 'chip' + (S.brand === b ? ' active' : '');
    el.textContent = b === CUSTOM ? t('tank_custom') : b;
    el.onclick = () => { S.brand = b; if (b === CUSTOM) updateCustomDraft(); renderTankPage(); };
    chips.appendChild(el);
  }

  const cur = tankChoice();
  const list = $('modelList'); list.innerHTML = '';
  $('customBox').hidden = S.brand !== CUSTOM;
  if (S.brand && S.brand !== CUSTOM){
    for (const [model, cap, h] of TANKS[S.brand]){
      const el = document.createElement('button');
      const active = cur && cur.brand === S.brand && cur.model === model;
      el.className = 'model' + (active ? ' active' : '');
      el.innerHTML = `<b>${model}</b><span>${nf(cap)} L, ${nf(h,1)} cm</span>`;
      el.onclick = () => { S.draft = {brand:S.brand, model, cap, height:h}; note('tankNote',''); renderTankPage(); };
      list.appendChild(el);
    }
  } else if (S.brand === CUSTOM && cur && cur.brand === 'Custom'){
    if (!$('customCap').value) $('customCap').value = cur.cap;
    if (!$('customHeight').value) $('customHeight').value = cur.height;
  }

  const gap = +$('gapInput').value || 25;
  const sum = $('tankSummary');
  if (!cur){ sum.innerHTML = ''; return; }
  sum.innerHTML =
    `<div><span>${t('sum_model')}</span><b>${cur.brand} ${cur.model}</b></div>
     <div><span>${t('sum_cap')}</span><b>${nf(cur.cap)} L</b></div>
     <div><span>${t('sum_height')}</span><b>${nf(cur.height,1)} cm</b></div>
     <div><span>${t('sum_usable')}</span><b>± ${nf(usableOf(cur.cap, cur.height, gap))} L</b></div>`;
}

function updateCustomDraft(){
  const cap = +$('customCap').value, h = +$('customHeight').value;
  S.draft = (cap > 0 && h > 0) ? {brand:'Custom', model:'Custom', cap, height:h} : null;
}

async function saveTank(){
  if (S.brand === CUSTOM) updateCustomDraft();
  const cur = tankChoice();
  const gap = +$('gapInput').value;
  if (!cur || !(cur.cap > 0) || !(cur.height > 40)){ note('tankNote', t('fill_tank'), 'err'); return; }
  if (!(gap >= 20 && gap <= 60) || cur.height - gap < 20){ note('tankNote', t('gap_hint'), 'err'); return; }
  try{
    await api(T_CFG + '?' + dev, {method:'PATCH', prefer:'return=minimal', body:{
      tank_brand:cur.brand, tank_model:cur.model, capacity_liters:cur.cap, tank_height_cm:cur.height, full_gap_cm:gap
    }});
    S.draft = null; S.dirtyGap = false;
    note('tankNote', t('saved'), 'good');
    await loadConfig(true);
  }catch(e){ note('tankNote', t('save_fail'), 'err'); console.warn(e); }
}

// =====================================================================
// ATUR POMPA: persen <-> liter saling terhubung
// =====================================================================
function fillAuto(){
  const c = S.cfg; if (!c) return;
  setThr('start', +c.start_percent);
  setThr('stop',  +c.stop_percent);
  $('dryMin').value = c.dry_run_minutes;
  S.dirtyAuto = false;
  drawPreview();
}

function setThr(kind, pct){
  const u = cfgUsable();
  $(kind+'Pct').value = Math.round(pct*10)/10;
  $(kind+'Range').value = pct;
  $(kind+'L').value = Math.round(pct/100*u);
}

function onThr(kind, src){
  const u = cfgUsable();
  let p;
  if (src === 'L'){
    p = u > 0 ? (+$(kind+'L').value) / u * 100 : 0;
    p = Math.round(p*10)/10;
    $(kind+'Pct').value = p;
    $(kind+'Range').value = p;
  } else {
    p = src === 'range' ? +$(kind+'Range').value : +$(kind+'Pct').value;
    if (src === 'range') $(kind+'Pct').value = p; else $(kind+'Range').value = p;
    $(kind+'L').value = Math.round(p/100*u);
  }
  S.dirtyAuto = true;
  note('autoNote','');
  drawPreview();
}

function drawPreview(){
  const s = clamp(+$('startPct').value || 0, 0, 100), e = clamp(+$('stopPct').value || 0, 0, 100);
  $('pvBand').style.left = s + '%';
  $('pvBand').style.width = Math.max(0, e - s) + '%';
  $('pvS').style.left = s + '%';
  $('pvE').style.left = e + '%';
  $('usableInfo').textContent = t('usable_info', {u: nf(cfgUsable())});
  $('pvText').textContent = e > s ? t('pv_text', {l: nf((e - s)/100*cfgUsable())}) : '';
}

async function saveAuto(){
  const s = +$('startPct').value, e = +$('stopPct').value, dry = Math.round(+$('dryMin').value);
  if (!(s >= 5 && s <= 90 && e >= 15 && e <= 95 && e - s >= 10)){ note('autoNote', t('threshold_err'), 'err'); return; }
  if (!(dry >= 3 && dry <= 60)){ $('dryMin').value = clamp(dry || 10, 3, 60); return; }
  try{
    await api(T_CFG + '?' + dev, {method:'PATCH', prefer:'return=minimal',
      body:{start_percent:s, stop_percent:e, dry_run_minutes:dry}});
    S.dirtyAuto = false;
    note('autoNote', t('saved'), 'good');
    await loadConfig(true);
  }catch(err){ note('autoNote', t('save_fail'), 'err'); console.warn(err); }
}

// =====================================================================
// FITUR: PERKIRAAN AIR HABIS (dari pemakaian 6 jam terakhir)
// =====================================================================
async function loadEstimate(){
  try{
    const since = new Date(Date.now() - 6*3600e3).toISOString();
    const rows = await api(`${T_HIST}?select=created_at,volume_liters,sensor_error&${dev}&created_at=gte.${encodeURIComponent(since)}&order=created_at.asc&limit=1000`);
    const pts = (rows || []).filter(r => !r.sensor_error && Number.isFinite(+r.volume_liters));
    if (pts.length < 20){ S.estimate = {kind:'unknown'}; return; }

    const B = new Map();
    for (const r of pts){
      const k = Math.floor(Date.parse(r.created_at) / 600000);
      const b = B.get(k) || {s:0, n:0}; b.s += +r.volume_liters; b.n++; B.set(k, b);
    }
    const keys = [...B.keys()].sort((a,b) => a - b);
    const dead = Math.max(3, cfgUsable() * 0.005);
    let used = 0;
    for (let i = 1; i < keys.length; i++){
      if (keys[i] - keys[i-1] > 3) continue;
      const a = B.get(keys[i-1]), b = B.get(keys[i]);
      const diff = a.s/a.n - b.s/b.n;
      if (diff > dead) used += diff;
    }
    const hours = (Date.parse(pts[pts.length-1].created_at) - Date.parse(pts[0].created_at)) / 3600e3;
    const rate = hours > 0.5 ? used / hours : 0;
    S.estimate = rate < 1 ? {kind:'long'} : {kind:'rate', rate};
  }catch(e){ console.warn('estimate:', e.message); }
  renderHome();
}

async function loadHistory(){
  try{
    const [usage, events] = await Promise.all([
      api('rpc/tandon_usage_daily', {method:'POST', body:{p_device:DEVICE_ID, p_days:31}}),
      api(`${T_EV}?select=created_at,type,reason,level_percent&${dev}&order=created_at.desc&limit=15`)
    ]);
    S.usage = usage || []; S.events = events || [];
  }catch(e){ console.warn('history:', e.message); }
  renderHistory();
}

function renderHistory(){
  const byDay = new Map(S.usage.map(r => [r.day, r]));
  const today = witaDate(new Date());
  const base = new Date(today + 'T12:00:00Z');
  const days = [];
  for (let i = 6; i >= 0; i--){
    const dt = new Date(base.getTime() - i*86400e3);
    days.push({key: dt.toISOString().slice(0,10), dow: dt.getUTCDay()});
  }

  const sum = rows => rows.reduce((a, r) => ({
    used: a.used + (+r.used_liters || 0), min: a.min + (+r.pump_minutes || 0), n: a.n + (+r.pump_starts || 0)
  }), {used:0, min:0, n:0});
  const rToday = sum(S.usage.filter(r => r.day === today));
  const rWeek  = sum(S.usage.filter(r => r.day >= days[0].key));
  const rMonth = sum(S.usage.filter(r => r.day.slice(0,7) === today.slice(0,7)));

  for (const [id, r] of [['Today', rToday], ['Week', rWeek], ['Month', rMonth]]){
    $('u'+id).textContent = nf(r.used) + ' L';
    $('s'+id).textContent = t('pump_summary', {n: nf(r.n), m: fmtDuration(r.min)});
  }

  const names = t('days');
  const max = Math.max(1, ...days.map(d => +(byDay.get(d.key)?.used_liters || 0)));
  $('chart').innerHTML = days.map(d => {
    const v = +(byDay.get(d.key)?.used_liters || 0);
    return `<div class="col${d.key === today ? ' today' : ''}"><b>${v ? nf(v) : ''}</b><i style="height:${Math.max(2, v/max*100)}%"></i><span>${names[d.dow]}</span></div>`;
  }).join('');

  const icons = {PUMP_ON:'▶️',PUMP_OFF:'⏹',DRY_RUN:'⚠️',SENSOR_ERROR:'⚠️',SENSOR_OK:'✅',OVERFLOW_STOP:'🛑',LOW_WATER:'💧',BOOT:'🔌'};
  const ul = $('events');
  if (!S.events.length){ ul.innerHTML = `<li><span class="et">${t('no_data')}</span></li>`; return; }
  ul.innerHTML = S.events.map(e => {
    const when = new Date(e.created_at).toLocaleString('id-ID',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'});
    const sub = [e.reason ? t('r_'+e.reason) : '', e.level_percent != null ? nf(e.level_percent)+'%' : ''].filter(Boolean).join(', ');
    return `<li><span class="ei">${icons[e.type] || '•'}</span><span class="et">${t('ev_'+e.type)}<small>${sub}</small></span><time>${when}</time></li>`;
  }).join('');
}

function renderLangs(){
  for (const g of ['regional', 'national']){
    const box = $(g === 'regional' ? 'langRegional' : 'langNational');
    box.innerHTML = '';
    for (const l of LANGS.filter(x => x.group === g)){
      const b = document.createElement('button');
      b.className = 'lang' + (l.code === LANG ? ' active' : '');
      b.innerHTML = `<b>${l.name}</b><span>${l.region}</span>`;
      b.onclick = () => setLang(l.code);
      box.appendChild(b);
    }
  }
}

function setLang(code){
  LANG = code;
  try { localStorage.setItem('tandonLang', code); } catch(e) {}
  document.documentElement.lang = code;
  document.querySelectorAll('[data-i18n]').forEach(n => n.textContent = t(n.dataset.i18n));
  renderLangs(); renderHome(); renderTankPage(); drawPreview(); renderHistory();
}

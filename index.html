<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SMART TANDON</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}body{margin:0;background:#050607;color:#eee;font-family:Arial,sans-serif}.wrap{max-width:1400px;margin:auto;padding:22px}
header{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #24292d;padding:8px 0 18px}.brand{display:flex;gap:12px;align-items:center}.logo{width:42px;height:42px;border:1px solid #777;border-radius:9px;display:grid;place-items:center;font-weight:800}h1{font-size:20px;letter-spacing:2px;margin:0}.sub{font-size:10px;color:#8d969c;margin-top:5px;letter-spacing:1px}.conn{font-size:11px;color:#8d969c}.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#e8b34d;margin-right:7px}.ok{background:#43d17a}.bad{background:#ef5b5b}
.summary{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:18px 0}.box,.card{background:#0b0e10;border:1px solid #24292d;border-radius:12px}.box{padding:14px}.lab{font-size:10px;color:#8d969c;letter-spacing:1px}.val{font-size:24px;font-weight:700;margin-top:6px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.card{padding:16px}.top{display:flex;justify-content:space-between;border-bottom:1px solid #24292d;padding-bottom:11px}.node{font-weight:700;letter-spacing:1px}.status{font-size:10px;padding:5px 8px;border:1px solid #333;border-radius:20px;color:#8d969c}.status.on{color:#43d17a}.status.al{color:#e8b34d}.status.off{color:#ef5b5b}.row{display:flex;gap:17px;align-items:center;margin-top:16px}.tank{width:65px;height:125px;border:2px solid #aaa;border-radius:9px 9px 14px 14px;position:relative;overflow:hidden;background:#070809;flex:none}.fill{position:absolute;bottom:0;left:0;right:0;background:#cbd0d3;height:0;transition:.2s}.tp{position:absolute;inset:0;display:grid;place-items:center;color:#050607;font-weight:bold;font-size:12px;z-index:2}.kg{font-size:29px;font-weight:800}.unit{font-size:11px;color:#8d969c}.barbg{height:5px;background:#202529;border-radius:5px;margin:10px 0}.bar{height:100%;background:#cbd0d3;width:0;transition:.2s}.metrics{display:grid;grid-template-columns:1fr 1fr;gap:8px}.metric{border:1px solid #24292d;border-radius:8px;padding:8px}.mv{font-weight:700;margin-top:4px}.foot{display:flex;justify-content:space-between;color:#697278;font-size:10px;margin-top:12px}
@media(max-width:900px){.grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:600px){.summary{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:1fr}.wrap{padding:12px}}
</style></head><body><div class="wrap">
<header><div class="brand"><div class="logo">ST</div><div><h1>SMART TANDON</h1><div class="sub">REALTIME EMULSION STOCK MONITORING</div></div></div><div class="conn"><span id="dot" class="dot"></span><span id="ct">CONNECTING...</span></div></header>
<section class="summary"><div class="box"><div class="lab">TOTAL NODE</div><div class="val">6</div></div><div class="box"><div class="lab">ONLINE</div><div class="val" id="online">0</div></div><div class="box"><div class="lab">ALARM</div><div class="val" id="alarm">0</div></div><div class="box"><div class="lab">UPDATE TERAKHIR</div><div class="val" id="last" style="font-size:18px">--:--:--</div></div></section>
<main id="grid" class="grid"></main></div>
<script>
const URL="https://rczihhduxywzcwhtphbw.supabase.co",KEY="sb_publishable_BnzsEVG8ajJYL1ksPJsOSg_G5bntZEl";
const db=window.supabase.createClient(URL,KEY), state={}; for(let i=1;i<=6;i++)state[i]=null;
function make(i){return `<article class="card"><div class="top"><div class="node">NODE ${i}</div><div id="s${i}" class="status off">OFFLINE</div></div><div class="row"><div class="tank"><div id="f${i}" class="fill"></div><div id="t${i}" class="tp">--%</div></div><div style="flex:1"><div><span id="k${i}" class="kg">--</span> <span class="unit">KG</span></div><div class="lab" style="margin-top:5px">LEVEL</div><div><b id="l${i}">--</b> cm</div><div class="barbg"><div id="b${i}" class="bar"></div></div><div class="metrics"><div class="metric"><div class="lab">JARAK</div><div class="mv"><span id="d${i}">--</span> cm</div></div><div class="metric"><div class="lab">PERSEN</div><div class="mv"><span id="p${i}">--</span>%</div></div></div></div></div><div class="foot"><span>Data terakhir</span><span id="time${i}">--</span></div></article>`}
grid.innerHTML=Array.from({length:6},(_,x)=>make(x+1)).join("");
function tm(x){return x?new Date(x).toLocaleTimeString("id-ID",{hour:"2-digit",minute:"2-digit",second:"2-digit"}):"--"}
function render(d){let i=+d.node_id;if(i<1||i>6)return;state[i]=d;let pct=Math.max(0,Math.min(100,+d.percent||0)),fresh=Date.now()-new Date(d.created_at).getTime()<5000,alarm=d.status==="ONLINE_ALARM";let s=document.getElementById("s"+i);s.className="status "+(alarm?"al":fresh?"on":"off");s.textContent=alarm?"ALARM":fresh?"ONLINE":"OFFLINE";document.getElementById("f"+i).style.height=pct+"%";document.getElementById("b"+i).style.width=pct+"%";document.getElementById("t"+i).textContent=pct.toFixed(1)+"%";document.getElementById("k"+i).textContent=(+d.kg||0).toFixed(1);document.getElementById("l"+i).textContent=(+d.level_cm||0).toFixed(1);document.getElementById("d"+i).textContent=(+d.distance_cm||0).toFixed(1);document.getElementById("p"+i).textContent=pct.toFixed(1);document.getElementById("time"+i).textContent=tm(d.created_at)}
function summary(){let o=0,a=0,last=null;for(let i=1;i<=6;i++){let d=state[i];if(!d)continue;let fresh=Date.now()-new Date(d.created_at).getTime()<5000;if(fresh)o++;if(fresh&&d.status==="ONLINE_ALARM")a++;if(!last||new Date(d.created_at)>new Date(last.created_at))last=d;render(d)}online.textContent=o;alarm.textContent=a;document.getElementById("last").textContent=last?tm(last.created_at):"--:--:--"}
function conn(ok){dot.className="dot "+(ok?"ok":"bad");ct.textContent=ok?"SUPABASE TERHUBUNG":"KONEKSI GAGAL"}
async function load(){let {data,error}=await db.from("tank_data").select("id,created_at,node_id,distance_cm,level_cm,kg,percent,status").order("created_at",{ascending:false}).limit(200);if(error){console.error(error);conn(false);return}for(let d of data||[]){let i=+d.node_id;if(i>=1&&i<=6&&!state[i])state[i]=d}for(let i=1;i<=6;i++)if(state[i])render(state[i]);conn(true);summary()}
load();
db.channel("tank-live").on("postgres_changes",{event:"INSERT",schema:"public",table:"tank_data"},p=>{render(p.new);summary();conn(true)}).subscribe(s=>{if(s==="SUBSCRIBED")conn(true);else if(s==="CHANNEL_ERROR"||s==="TIMED_OUT")conn(false)});
setInterval(summary,1000);setInterval(load,15000);
</script></body></html>

<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#06131c">
<title>Controller Tandon</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* ===================== WARNA (gelap & terang) ===================== */
:root{
  --r:20px;--ok:#2fd18b;--warn:#f5a524;--bad:#ff5c6c;
  --bg:#06131c;--bg2:#0e3247;--panel:#0c1f2c;--panel2:#10283a;--line:#1d3b4f;
  --text:#e9f5fa;--muted:#8fabb8;--water:#2fb6f2;--water2:#7fe0ff;--waterDeep:#1478aa;
  --chip:#0a2433;--input:#061822;--tankEdge:#b8d8e3;--tankBg:#071a25;
  --shadow:0 12px 32px rgba(0,0,0,.28);--onAccent:#04131b;--soft:rgba(255,255,255,.03);
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    --bg:#e9f3f7;--bg2:#cfe7f2;--panel:#ffffff;--panel2:#f7fbfd;--line:#d3e3ea;
    --text:#0c2330;--muted:#567180;--water:#1aa3e3;--water2:#5ccdf6;--waterDeep:#0d74a8;
    --chip:#eef6f9;--input:#f7fbfd;--tankEdge:#7aa9bb;--tankBg:#f1f8fb;
    --shadow:0 12px 32px rgba(12,35,48,.08);--onAccent:#ffffff;--soft:rgba(12,35,48,.03);
    --ok:#12a86a;--warn:#c97a00;--bad:#e03445;
  }
}
:root[data-theme="light"]{
  --bg:#e9f3f7;--bg2:#cfe7f2;--panel:#ffffff;--panel2:#f7fbfd;--line:#d3e3ea;
  --text:#0c2330;--muted:#567180;--water:#1aa3e3;--water2:#5ccdf6;--waterDeep:#0d74a8;
  --chip:#eef6f9;--input:#f7fbfd;--tankEdge:#7aa9bb;--tankBg:#f1f8fb;
  --shadow:0 12px 32px rgba(12,35,48,.08);--onAccent:#ffffff;--soft:rgba(12,35,48,.03);
  --ok:#12a86a;--warn:#c97a00;--bad:#e03445;
}

*{box-sizing:border-box}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{margin:0;color:var(--text);font-family:'Plus Jakarta Sans',system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif}
body{background:radial-gradient(1100px 560px at 85% -10%,var(--bg2) 0,transparent 60%),var(--bg);min-height:100vh;padding-bottom:88px;transition:background-color .3s}
button{font:inherit;cursor:pointer;color:inherit}
:focus-visible{outline:3px solid var(--water2);outline-offset:2px}
.app{max-width:1120px;margin:0 auto;padding:16px}

/* ===================== HEADER ===================== */
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px}
.brand{display:flex;gap:12px;align-items:center;min-width:0}
.logo{flex:none;width:46px;height:46px;border-radius:15px;display:grid;place-items:center;background:linear-gradient(160deg,var(--water),var(--waterDeep));box-shadow:0 6px 18px rgba(26,163,227,.35)}
.logo svg{width:24px;height:24px}
h1{font-size:19px;margin:0;letter-spacing:-.2px}
.brand p{margin:2px 0 0;color:var(--muted);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topRight{display:flex;align-items:center;gap:8px}
.clock{font-size:13px;color:var(--muted);font-weight:700;white-space:nowrap}
@media(max-width:480px){.clock{display:none}}
.pill{display:flex;align-items:center;gap:8px;padding:8px 12px;border-radius:999px;border:1px solid var(--line);background:var(--panel);font-size:13px;font-weight:700;white-space:nowrap}
.pill i{width:9px;height:9px;border-radius:50%;background:var(--warn)}
.pill.ok i{background:var(--ok);box-shadow:0 0 0 4px color-mix(in srgb,var(--ok) 20%,transparent)}
.pill.bad i{background:var(--bad)}
.iconBtn{width:38px;height:38px;border-radius:12px;border:1px solid var(--line);background:var(--panel);display:grid;place-items:center;font-size:17px}

/* ===================== NAV ===================== */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;display:grid;grid-template-columns:repeat(5,1fr);background:color-mix(in srgb,var(--bg) 94%,transparent);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));backdrop-filter:blur(10px)}
.tabs button{background:none;border:0;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:3px;padding:7px 2px;border-radius:14px;font-size:11.5px;font-weight:700}
.tabs .ic{font-size:20px;line-height:1}
.tabs button.active{color:var(--text);background:var(--panel2)}
@media(min-width:860px){
  body{padding-bottom:0}
  .tabs{position:static;display:flex;gap:6px;background:none;border:0;padding:0;margin-bottom:18px;backdrop-filter:none}
  .tabs button{flex-direction:row;gap:8px;padding:10px 16px;font-size:14px;border:1px solid transparent}
  .tabs button.active{border-color:var(--line);background:var(--panel)}
}

/* ===================== LAYOUT ===================== */
.page{display:none}
.page.active{display:block;animation:fade .25s ease}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.homeGrid{display:grid;gap:14px}
@media(min-width:860px){
  .homeGrid{grid-template-columns:1.45fr 1fr;align-items:start}
  .homeGrid .card{margin-bottom:0}
  .twoCol{display:grid;grid-template-columns:1fr 1fr;gap:14px;align-items:start}
  .twoCol .card{margin-bottom:0}
}
.stack{display:grid;gap:14px}
.homeGrid .card,.stack .card{margin-bottom:0}
.card{background:linear-gradient(160deg,var(--panel2),var(--panel));border:1px solid var(--line);border-radius:var(--r);padding:18px;margin-bottom:14px;box-shadow:var(--shadow)}
h2{font-size:18px;margin:0 0 4px}
h3{font-size:15.5px;margin:0 0 10px}
.muted{color:var(--muted);font-size:14px;margin:0;line-height:1.55}
.rowBetween{display:flex;justify-content:space-between;align-items:center;gap:12px}

.btn{border:0;border-radius:15px;padding:15px 16px;font-weight:800;font-size:17px;color:var(--onAccent);transition:transform .1s,opacity .2s}
.btn:active:not(:disabled){transform:scale(.98)}
.btn:disabled{opacity:.28;cursor:not-allowed}
.btn.on{background:var(--ok);color:#04131b}
.btn.off{background:var(--bad);color:#fff}
.btn.primary{background:var(--water);width:100%;margin-top:16px}
.btn.small{padding:9px 14px;font-size:14px;background:var(--warn);color:#1b1200;margin-top:10px}
.note{min-height:1.3em;font-size:14px;color:var(--muted);margin:10px 0 0}
.note.err{color:var(--bad)}
.note.good{color:var(--ok)}

/* ===================== BANNER ===================== */
.banner{display:flex;gap:12px;align-items:flex-start;border-radius:var(--r);padding:14px 16px;margin-bottom:14px;border:1px solid}
.banner[hidden]{display:none}
.banner .ai{font-size:24px;line-height:1.1}
.banner b{display:block;font-size:15px;line-height:1.45}
.banner.bad{background:color-mix(in srgb,var(--bad) 12%,transparent);border-color:color-mix(in srgb,var(--bad) 55%,transparent)}
.banner.warn{background:color-mix(in srgb,var(--warn) 12%,transparent);border-color:color-mix(in srgb,var(--warn) 55%,transparent)}

/* ===================== TANDON ===================== */
.hero{display:grid;grid-template-columns:auto 1fr;gap:26px;align-items:center}
@media(max-width:560px){.hero{grid-template-columns:1fr;justify-items:center;text-align:center}.facts{text-align:left;width:100%}}
.tankWrap{position:relative;display:flex;align-items:flex-end;gap:8px;padding-top:26px}
.pipe{position:absolute;top:0;left:-11px;width:48px;height:34px;border:7px solid var(--tankEdge);border-left:0;border-bottom:0;border-radius:0 14px 0 0;opacity:.8}
.tank{position:relative;width:156px;height:250px;border:4px solid var(--tankEdge);border-radius:32px 32px 24px 24px;overflow:hidden;background:var(--tankBg)}
.tank::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(to top,transparent 0 24%,color-mix(in srgb,var(--tankEdge) 25%,transparent) 24% 24.6%);z-index:1;pointer-events:none}
.water{position:absolute;left:0;right:0;bottom:0;height:0;background:linear-gradient(to top,var(--waterDeep),var(--water));transition:height 1.2s cubic-bezier(.2,.8,.2,1)}
.wave{position:absolute;top:-6px;left:-50%;width:200%;height:7px;background:radial-gradient(ellipse 22px 7px at 50% 100%,var(--water) 98%,transparent 100%) 0 0/40px 7px repeat-x;animation:wave 3s linear infinite}
.water.empty .wave{display:none}
@keyframes wave{to{transform:translateX(40px)}}
.stream{position:absolute;left:26px;top:0;width:7px;border-radius:0 0 4px 4px;background:repeating-linear-gradient(to bottom,var(--water2) 0 10px,transparent 10px 16px);background-size:100% 16px;animation:pour .45s linear infinite;opacity:0;transition:opacity .4s;z-index:2}
.filling .stream{opacity:.9}
@keyframes pour{to{background-position:0 16px}}
.bubbles span{position:absolute;bottom:4px;width:7px;height:7px;border-radius:50%;border:1.5px solid rgba(255,255,255,.6);opacity:0}
.filling .bubbles span{animation:rise 2.4s ease-in infinite}
.bubbles span:nth-child(1){left:18%;animation-delay:0s}
.bubbles span:nth-child(2){left:42%;animation-delay:.7s;width:5px;height:5px}
.bubbles span:nth-child(3){left:66%;animation-delay:1.3s}
.bubbles span:nth-child(4){left:82%;animation-delay:1.9s;width:5px;height:5px}
@keyframes rise{0%{transform:translateY(0);opacity:0}15%{opacity:.9}100%{transform:translateY(-140px);opacity:0}}
.pct{position:absolute;inset:0;display:grid;place-items:center;z-index:3}
.pct span{font-size:32px;font-weight:800;color:#fff;background:color-mix(in srgb,var(--waterDeep) 80%,transparent);padding:2px 12px;border-radius:14px;box-shadow:0 4px 14px rgba(0,0,0,.2)}
.mark{position:absolute;left:0;right:0;border-top:2px dashed var(--ok);z-index:2;transition:bottom .6s}
.mark span{position:absolute;right:4px;top:-20px;font-size:10.5px;font-weight:800;color:var(--ok);background:color-mix(in srgb,var(--bg) 85%,transparent);padding:1px 6px;border-radius:6px}
.mark.start{border-color:var(--warn)}
.mark.start span{color:var(--warn);top:3px}
.mark[hidden]{display:none}
.scale{display:flex;flex-direction:column;justify-content:space-between;height:250px;font-size:10.5px;color:var(--muted);font-weight:700;padding:6px 0}
.readout{min-width:0;width:100%}
.readout .label{color:var(--muted);font-weight:700}
.liters{font-size:56px;font-weight:800;line-height:1.05;letter-spacing:-1.5px;margin-top:2px;font-variant-numeric:tabular-nums}
.liters small{font-size:22px;color:var(--muted);letter-spacing:0}
.state{display:inline-flex;align-items:center;gap:7px;margin:12px 0 8px;padding:7px 13px;border-radius:999px;font-weight:800;font-size:15px;background:color-mix(in srgb,var(--ok) 15%,transparent);color:var(--ok)}
.state.warn{background:color-mix(in srgb,var(--warn) 15%,transparent);color:var(--warn)}
.state.bad{background:color-mix(in srgb,var(--bad) 15%,transparent);color:var(--bad)}
.state.info{background:color-mix(in srgb,var(--water) 15%,transparent);color:var(--water)}
.estimate{font-size:15px;color:var(--muted)}
.estimate b{color:var(--text)}
.bar{height:8px;background:color-mix(in srgb,var(--line) 70%,transparent);border-radius:9px;overflow:hidden;margin:14px 0}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--water),var(--water2));transition:width 1.2s}
.facts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:0}
.facts div{background:var(--soft);border:1px solid var(--line);border-radius:13px;padding:9px 11px}
dt{font-size:12px;color:var(--muted)}
dd{margin:2px 0 0;font-weight:800}

/* ===================== POMPA ===================== */
.pumpTop{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.pumpState{display:flex;align-items:center;gap:12px;font-size:22px;font-weight:800}
.lamp{width:18px;height:18px;border-radius:50%;background:color-mix(in srgb,var(--muted) 50%,transparent);flex:none}
.lamp.on{background:var(--ok);box-shadow:0 0 0 6px color-mix(in srgb,var(--ok) 20%,transparent),0 0 18px var(--ok);animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 0 10px color-mix(in srgb,var(--ok) 8%,transparent),0 0 10px var(--ok)}}
.seg{display:flex;background:var(--chip);border:1px solid var(--line);border-radius:13px;padding:3px}
.seg button{border:0;background:none;color:var(--muted);padding:9px 14px;border-radius:10px;font-weight:800}
.seg button.active{background:var(--water);color:var(--onAccent)}
.seg button:disabled{cursor:not-allowed}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.chipInfo{display:inline-flex;align-items:center;gap:6px;padding:7px 11px;border-radius:999px;background:var(--chip);border:1px solid var(--line);font-size:13px;font-weight:700;color:var(--muted)}
.chipInfo.warn{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 45%,transparent)}
.chipInfo.ok{color:var(--ok);border-color:color-mix(in srgb,var(--ok) 45%,transparent)}
.today{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.today div{background:var(--soft);border:1px solid var(--line);border-radius:13px;padding:10px 11px}
.today b{display:block;font-size:19px;font-weight:800;margin-top:2px;font-variant-numeric:tabular-nums}
.today span{font-size:12px;color:var(--muted)}

/* ===================== FORM ===================== */
.brandChips{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0}
.chip{border:1px solid var(--line);background:var(--chip);padding:10px 15px;border-radius:999px;font-weight:700}
.chip.active{background:var(--water);color:var(--onAccent);border-color:transparent}
.models{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px}
.model{text-align:left;border:1px solid var(--line);background:var(--chip);border-radius:14px;padding:12px}
.model b{display:block;font-size:15px}
.model span{color:var(--muted);font-size:13px}
.model.active{border-color:var(--water);box-shadow:inset 0 0 0 1px var(--water)}
.field{display:block;margin-top:12px}
.field>span{display:block;font-size:13.5px;color:var(--muted);margin-bottom:6px;font-weight:700}
input[type=number],input[type=time]{width:100%;background:var(--input);border:1px solid var(--line);color:var(--text);border-radius:12px;padding:12px;font:inherit;font-size:18px;font-weight:800;color-scheme:light dark}
input:disabled{opacity:.45}
.hint{font-size:12.5px;color:var(--muted);margin-top:6px;line-height:1.5}
.summary{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.summary div{background:var(--soft);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.summary b{display:block;font-size:17px}
.summary span{font-size:12.5px;color:var(--muted)}
.thr{margin-top:14px;padding:14px;border:1px solid var(--line);border-radius:15px;background:var(--soft)}
.thrLabel{display:flex;align-items:center;gap:9px;font-weight:800;margin-bottom:10px}
.dot{width:12px;height:12px;border-radius:50%;flex:none}
.dot.start{background:var(--warn)}
.dot.stop{background:var(--ok)}
.dot.w1{background:var(--water)}
.dot.w2{background:var(--water2)}
.pair{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center}
.unit{position:relative;display:block}
.unit input{padding-right:42px}
.unit em{position:absolute;right:13px;top:50%;transform:translateY(-50%);font-style:normal;color:var(--muted);font-weight:800}
.eq{color:var(--muted);font-weight:800}
input[type=range]{width:100%;margin-top:14px;accent-color:var(--water);height:28px}
.preview{position:relative;height:18px;border-radius:9px;background:color-mix(in srgb,var(--line) 70%,transparent);margin-top:16px;overflow:hidden}
.preview i{position:absolute;top:0;bottom:0;background:color-mix(in srgb,var(--water) 45%,transparent)}
.preview .s,.preview .e{position:absolute;top:0;bottom:0;width:3px}
.preview .s{background:var(--warn)}
.preview .e{background:var(--ok)}
.inline{display:flex;align-items:center;gap:10px}
.inline input{max-width:110px}

/* switch */
.switch{position:relative;display:inline-block;width:52px;height:30px;flex:none}
.switch input{position:absolute;opacity:0;width:100%;height:100%;margin:0;cursor:pointer;z-index:1}
.switch span{position:absolute;inset:0;border-radius:999px;background:color-mix(in srgb,var(--muted) 40%,transparent);transition:background .2s}
.switch span::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:transform .2s;box-shadow:0 2px 6px rgba(0,0,0,.25)}
.switch input:checked+span{background:var(--water)}
.switch input:checked+span::after{transform:translateX(22px)}
.switch input:focus-visible+span{outline:3px solid var(--water2);outline-offset:2px}

/* jadwal */
.win{margin-top:12px;padding:14px;border:1px solid var(--line);border-radius:15px;background:var(--soft)}
.winHead{display:flex;align-items:center;gap:10px;font-weight:800}
.times{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.win.off .times{opacity:.4;pointer-events:none}
.timeline{position:relative;height:30px;border-radius:10px;background:color-mix(in srgb,var(--line) 70%,transparent);margin-top:16px;overflow:hidden}
.timeline i{position:absolute;top:0;bottom:0}
.timeline i.w1{background:color-mix(in srgb,var(--water) 70%,transparent)}
.timeline i.w2{background:color-mix(in srgb,var(--water2) 60%,transparent)}
.timeline .now{position:absolute;top:-2px;bottom:-2px;width:3px;background:var(--text);border-radius:2px}
.tlLabels{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);font-weight:700;margin-top:5px}
.check{display:flex;gap:12px;align-items:flex-start;margin-top:14px;cursor:pointer}
.check input{width:22px;height:22px;accent-color:var(--water);flex:none;margin-top:1px}
.check b{display:block;font-size:14.5px}
.check small{color:var(--muted);font-size:12.5px}
#schedBody.disabled{opacity:.45;pointer-events:none}

/* ===================== RIWAYAT ===================== */
.totals{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px}
@media(max-width:560px){.totals{grid-template-columns:1fr}}
.tot{border:1px solid var(--line);border-radius:15px;padding:12px 14px;background:var(--soft)}
.tot .k{color:var(--muted);font-size:13px;font-weight:700}
.tot .v{font-size:27px;font-weight:800;margin:4px 0;font-variant-numeric:tabular-nums}
.tot .s{font-size:13px;color:var(--muted);line-height:1.5}
.chart{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;align-items:end;height:190px;margin-top:8px}
.col{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:6px;font-size:12px;color:var(--muted)}
.col i{width:100%;max-width:40px;border-radius:8px 8px 3px 3px;background:linear-gradient(to top,var(--waterDeep),var(--water));min-height:4px;transition:height .8s}
.col.today i{background:linear-gradient(to top,#24966a,var(--ok))}
.col b{color:var(--text);font-size:11px}
.lineChart svg{width:100%;height:auto;display:block}
.lc-grid{stroke:var(--line);stroke-width:1}
.lc-lab{fill:var(--muted);font-size:10px;font-weight:700;font-family:inherit}
.lc-area{fill:color-mix(in srgb,var(--water) 28%,transparent)}
.lc-line{fill:none;stroke:var(--water);stroke-width:2.5;stroke-linejoin:round}
.lc-pump{fill:color-mix(in srgb,var(--ok) 22%,transparent)}
.lc-start{stroke:var(--warn);stroke-dasharray:5 5;stroke-width:1.5}
.lc-stop{stroke:var(--ok);stroke-dasharray:5 5;stroke-width:1.5}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);font-weight:700;margin-top:8px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:14px;height:10px;border-radius:3px;display:inline-block}
.events{list-style:none;padding:0;margin:0;display:grid;gap:8px}
.events li{display:flex;gap:10px;align-items:center;padding:10px 12px;border-radius:13px;background:var(--soft);border:1px solid var(--line)}
.events .ei{font-size:18px;flex:none}
.events .et{flex:1;font-weight:700;font-size:14px;min-width:0}
.events .et small{display:block;color:var(--muted);font-weight:500}
.events time{font-size:12px;color:var(--muted);white-space:nowrap}

/* ===================== BAHASA ===================== */
.group{margin-top:18px;font-size:13px;color:var(--muted);font-weight:800}
.langs{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:8px;margin-top:8px}
.lang{display:flex;flex-direction:column;align-items:flex-start;border:1px solid var(--line);background:var(--chip);border-radius:14px;padding:12px 14px;text-align:left}
.lang b{font-size:16px}
.lang span{color:var(--muted);font-size:13px}
.lang.active{border-color:var(--water);box-shadow:inset 0 0 0 1px var(--water)}

/* ===================== TOAST ===================== */
.toast{position:fixed;left:50%;bottom:96px;transform:translate(-50%,20px);background:var(--text);color:var(--bg);padding:12px 18px;border-radius:14px;font-weight:700;font-size:14px;opacity:0;pointer-events:none;transition:all .25s;z-index:50;max-width:calc(100% - 32px);text-align:center;box-shadow:var(--shadow)}
.toast.show{opacity:1;transform:translate(-50%,0)}
.toast.err{background:var(--bad);color:#fff}
@media(min-width:860px){.toast{bottom:28px}}

@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

<body>
<div class="app">

<header class="top">
  <div class="brand">
    <div class="logo" aria-hidden="true"><svg viewBox="0 0 24 24" fill="#fff"><path d="M12 2.5c-.3 0-.6.2-.8.4C9.6 5 5.5 10.2 5.5 14.2A6.5 6.5 0 0 0 18.5 14.2c0-4-4.1-9.2-5.7-11.3a1 1 0 0 0-.8-.4Zm-3 12.1a.9.9 0 0 1 .9.9 2.6 2.6 0 0 0 2.6 2.6.9.9 0 1 1 0 1.8 4.4 4.4 0 0 1-4.4-4.4.9.9 0 0 1 .9-.9Z"/></svg></div>
    <div><h1>Controller Tandon</h1><p id="tankLabel">—</p></div>
  </div>
  <div class="topRight">
    <span class="clock" id="clock"></span>
    <div class="pill wait" id="connPill"><i></i><span id="connText"></span></div>
    <button class="iconBtn" id="themeBtn" type="button">🌙</button>
  </div>
</header>

<nav class="tabs" id="tabs">
  <button data-page="home" class="active"><span class="ic">🏠</span><span data-i18n="nav_home"></span></button>
  <button data-page="tank"><span class="ic">🛢️</span><span data-i18n="nav_tank"></span></button>
  <button data-page="pump"><span class="ic">⚙️</span><span data-i18n="nav_pump"></span></button>
  <button data-page="history"><span class="ic">📊</span><span data-i18n="nav_history"></span></button>
  <button data-page="lang"><span class="ic">🌐</span><span data-i18n="nav_lang"></span></button>
</nav>

<main>
<!-- ======================= BERANDA ======================= -->
<section id="pg-home" class="page active">
  <div class="banner bad" id="alarmBox" hidden>
    <div class="ai">⚠️</div>
    <div><b id="alarmText"></b><button class="btn small" id="alarmReset" data-i18n="reset_alarm"></button></div>
  </div>
  <div class="banner warn" id="panelBox" hidden>
    <div class="ai">🔧</div>
    <div><b id="panelText"></b></div>
  </div>

  <div class="homeGrid">
    <div class="card hero">
      <div class="tankWrap" id="tankWrap" aria-hidden="true">
        <div class="pipe"></div>
        <div class="tank">
          <div class="stream" id="stream"></div>
          <div class="water empty" id="water"><div class="wave"></div><div class="bubbles"><span></span><span></span><span></span><span></span></div></div>
          <div class="mark" id="markStop" hidden><span></span></div>
          <div class="mark start" id="markStart" hidden><span></span></div>
          <div class="pct"><span id="pctBig">—</span></div>
        </div>
        <div class="scale"><span>100</span><span>75</span><span>50</span><span>25</span><span>0</span></div>
      </div>
      <div class="readout">
        <div class="label" data-i18n="water_in_tank"></div>
        <div class="liters"><span id="litersBig">—</span> <small>L</small></div>
        <div class="muted" id="ofCap"></div>
        <div class="state info" id="stateText"></div>
        <div class="estimate"><span data-i18n="estimate"></span>: <b id="estText">—</b></div>
        <div class="bar"><i id="barFill"></i></div>
        <dl class="facts">
          <div><dt data-i18n="empty_space"></dt><dd id="emptyL">—</dd></div>
          <div><dt data-i18n="level"></dt><dd id="levelCm">—</dd></div>
          <div><dt data-i18n="last_seen"></dt><dd id="lastSeen">—</dd></div>
          <div><dt data-i18n="signal"></dt><dd id="rssi">—</dd></div>
        </dl>
      </div>
    </div>

    <div class="stack">
      <div class="card">
        <div class="pumpTop">
          <div class="pumpState"><span class="lamp" id="lamp"></span><span id="pumpText">—</span></div>
          <div class="seg" role="group">
            <button id="modeAuto" data-i18n="mode_auto"></button>
            <button id="modeManual" data-i18n="mode_manual"></button>
          </div>
        </div>
        <p class="muted" id="modeDesc"></p>
        <div class="btns">
          <button class="btn on" id="btnOn" data-i18n="btn_on"></button>
          <button class="btn off" id="btnOff" data-i18n="btn_off"></button>
        </div>
        <div class="chips" id="pumpChips"></div>
        <p class="note" id="cmdNote"></p>
      </div>

      <div class="card">
        <h3 data-i18n="today_card"></h3>
        <div class="today">
          <div><span data-i18n="used_water"></span><b id="tdUsed">—</b></div>
          <div><span data-i18n="pump_times"></span><b id="tdStarts">—</b></div>
          <div><span data-i18n="pump_duration"></span><b id="tdDur">—</b></div>
        </div>
      </div>
    </div>
  </div>
</section>

<!-- ======================= TANDON ======================= -->
<section id="pg-tank" class="page">
  <div class="twoCol">
    <div class="card">
      <h2 data-i18n="tank_title"></h2>
      <p class="muted" data-i18n="tank_desc"></p>
      <div class="brandChips" id="brandChips"></div>
      <div class="models" id="modelList"></div>
      <div id="customBox" hidden>
        <label class="field"><span data-i18n="capacity"></span><input type="number" id="customCap" inputmode="numeric" min="10" placeholder="1200"></label>
        <label class="field"><span data-i18n="height"></span><input type="number" id="customHeight" inputmode="decimal" min="40" placeholder="160"></label>
        <p class="hint" data-i18n="height_hint"></p>
      </div>
    </div>
    <div class="card">
      <h3 data-i18n="tank_selected"></h3>
      <div class="summary" id="tankSummary"></div>
      <label class="field"><span data-i18n="gap"></span><input type="number" id="gapInput" inputmode="decimal" min="20" max="60"></label>
      <p class="hint" data-i18n="gap_hint"></p>
      <button class="btn primary" id="saveTank" data-i18n="save"></button>
    </div>
  </div>
</section>

<!-- ======================= ATUR POMPA ======================= -->
<section id="pg-pump" class="page">
  <div class="twoCol">
    <div class="card">
      <h2 data-i18n="auto_title"></h2>
      <p class="muted" id="usableInfo"></p>
      <div class="thr">
        <div class="thrLabel"><span class="dot start"></span><span data-i18n="start_at"></span></div>
        <div class="pair">
          <label class="unit"><input type="number" id="startPct" inputmode="decimal" min="5" max="90" step="1"><em>%</em></label>
          <span class="eq">=</span>
          <label class="unit"><input type="number" id="startL" inputmode="numeric" min="0" step="10"><em>L</em></label>
        </div>
        <input type="range" id="startRange" min="5" max="90" step="1" aria-label="start">
      </div>
      <div class="thr">
        <div class="thrLabel"><span class="dot stop"></span><span data-i18n="stop_at"></span></div>
        <div class="pair">
          <label class="unit"><input type="number" id="stopPct" inputmode="decimal" min="15" max="95" step="1"><em>%</em></label>
          <span class="eq">=</span>
          <label class="unit"><input type="number" id="stopL" inputmode="numeric" min="0" step="10"><em>L</em></label>
        </div>
        <input type="range" id="stopRange" min="15" max="95" step="1" aria-label="stop">
      </div>
      <div class="preview" aria-hidden="true"><i id="pvBand"></i><span class="s" id="pvS"></span><span class="e" id="pvE"></span></div>
      <p class="hint" id="pvText"></p>

      <h3 style="margin-top:22px" data-i18n="dry_title"></h3>
      <p class="muted" data-i18n="dry_explain"></p>
      <label class="field"><span data-i18n="dry_desc"></span>
        <div class="inline"><input type="number" id="dryMin" min="3" max="60" inputmode="numeric"><b data-i18n="minutes"></b></div>
      </label>
      <button class="btn primary" id="saveAuto" data-i18n="save"></button>
    </div>

    <div class="card">
      <div class="rowBetween">
        <h2 data-i18n="sched_title"></h2>
        <label class="switch"><input type="checkbox" id="schedOn" aria-label="jadwal"><span></span></label>
      </div>
      <p class="muted" data-i18n="sched_desc"></p>
      <div id="schedBody">
        <div class="win" id="win1">
          <div class="winHead"><span class="dot w1"></span><span data-i18n="sched_w1"></span></div>
          <div class="times">
            <label class="field"><span data-i18n="sched_from"></span><input type="time" id="s1s"></label>
            <label class="field"><span data-i18n="sched_to"></span><input type="time" id="s1e"></label>
          </div>
        </div>
        <div class="win" id="win2">
          <div class="winHead">
            <label class="switch"><input type="checkbox" id="s2On" aria-label="jadwal 2"><span></span></label>
            <span class="dot w2"></span><span data-i18n="sched_w2"></span>
          </div>
          <div class="times">
            <label class="field"><span data-i18n="sched_from"></span><input type="time" id="s2s"></label>
            <label class="field"><span data-i18n="sched_to"></span><input type="time" id="s2e"></label>
          </div>
        </div>
        <div class="timeline" id="timeline"></div>
        <div class="tlLabels"><span>00</span><span>06</span><span>12</span><span>18</span><span>24</span></div>
        <label class="check"><input type="checkbox" id="schedFill"><span><b data-i18n="sched_fill"></b><small data-i18n="sched_fill_hint"></small></span></label>
      </div>
      <p class="hint" data-i18n="sched_auto_only"></p>
      <button class="btn primary" id="saveSched" data-i18n="save"></button>
    </div>
  </div>
</section>

<!-- ======================= RIWAYAT ======================= -->
<section id="pg-history" class="page">
  <div class="card">
    <h2 data-i18n="history_title"></h2>
    <div class="totals">
      <div class="tot"><div class="k" data-i18n="today"></div><div class="v" id="uToday">—</div><div class="s" id="sToday"></div></div>
      <div class="tot"><div class="k" data-i18n="week"></div><div class="v" id="uWeek">—</div><div class="s" id="sWeek"></div></div>
      <div class="tot"><div class="k" data-i18n="month"></div><div class="v" id="uMonth">—</div><div class="s" id="sMonth"></div></div>
    </div>
  </div>
  <div class="card">
    <h3 data-i18n="chart_24h"></h3>
    <div class="lineChart" id="lineChart"></div>
    <div class="legend">
      <span><i style="background:var(--water)"></i><span data-i18n="level"></span></span>
      <span><i style="background:color-mix(in srgb,var(--ok) 35%,transparent)"></i><span data-i18n="chart_pump"></span></span>
    </div>
  </div>
  <div class="twoCol">
    <div class="card">
      <h3 data-i18n="chart_7d"></h3>
      <div class="chart" id="chart"></div>
    </div>
    <div class="card">
      <h3 data-i18n="events"></h3>
      <ul class="events" id="events"></ul>
    </div>
  </div>
</section>

<!-- ======================= BAHASA ======================= -->
<section id="pg-lang" class="page">
  <div class="card">
    <h2 data-i18n="lang_title"></h2>
    <p class="muted" data-i18n="lang_desc"></p>
    <div class="group" data-i18n="lang_regional"></div>
    <div class="langs" id="langRegional"></div>
    <div class="group" data-i18n="lang_national"></div>
    <div class="langs" id="langNational"></div>
  </div>
</section>
</main>
</div>

        : (I18N.id[key] !== undefined ? I18N.id[key] : key);
  if (vars && typeof s === 'string') for (const k in vars) s = s.split('{'+k+'}').join(vars[k]);
  return s;
}

function systemTheme(){ return matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark'; }
let THEME = null;
try { THEME = localStorage.getItem('tandonTheme'); } catch(e) {}
function applyTheme(){
  const th = THEME || systemTheme();
  document.documentElement.dataset.theme = th;
  document.querySelector('meta[name=theme-color]').content = th === 'light' ? '#e9f3f7' : '#06131c';
  $('themeBtn').textContent = th === 'light' ? '🌙' : '☀️';
  if (S.series) renderLineChart();
}

// =====================================================================
// UTIL
// =====================================================================
const $ = id => document.getElementById(id);
const nf = (v, d=0) => Number(v).toLocaleString('id-ID',{minimumFractionDigits:d,maximumFractionDigits:d});
const clamp = (v,a,b) => Math.max(a, Math.min(b, v));
const dev = 'device_id=eq.' + encodeURIComponent(DEVICE_ID);

async function api(path, {method='GET', body, prefer} = {}){
  const headers = {apikey:SUPABASE_KEY, Authorization:'Bearer '+SUPABASE_KEY, Accept:'application/json'};
  if (body !== undefined) headers['Content-Type'] = 'application/json';
  if (prefer) headers.Prefer = prefer;
  const res = await fetch(SUPABASE_URL + '/rest/v1/' + path, {
    method, headers, cache:'no-store', body: body !== undefined ? JSON.stringify(body) : undefined
  });
  const text = await res.text();
  if (!res.ok) throw new Error(res.status + ' ' + text);
  return text ? JSON.parse(text) : null;
}

function note(id, msg, kind){
  const el = $(id); el.textContent = msg || '';
  el.className = 'note' + (kind ? ' ' + kind : '');
}
let toastTimer;
function toast(msg, err){
  const el = $('toast');
  el.textContent = msg; el.className = 'toast show' + (err ? ' err' : '');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.className = 'toast' + (err ? ' err' : ''), 3200);
}

function usableOf(cap, h, gap){ return h > gap ? cap * (h - gap) / h : 0; }
function cfgUsable(){ const c = S.cfg; return c ? usableOf(+c.capacity_liters, +c.tank_height_cm, +c.full_gap_cm) : 0; }
function fmtDuration(min){
  min = Math.round(min);
  if (min < 60) return min + ' ' + t('minutes_short');
  return nf(Math.floor(min/60)) + ' ' + t('hours_short') + ' ' + (min%60) + ' ' + t('minutes_short');
}
function witaDate(d){ return d.toLocaleDateString('en-CA',{timeZone:'Asia/Makassar'}); }
function witaMinutes(d = new Date()){
  const p = new Intl.DateTimeFormat('en-GB',{timeZone:'Asia/Makassar',hour:'2-digit',minute:'2-digit',hour12:false}).formatToParts(d);
  const h = +p.find(x => x.type === 'hour').value % 24, m = +p.find(x => x.type === 'minute').value;
  return h * 60 + m;
}
const pad = n => String(n).padStart(2, '0');
const m2hhmm = m => pad(Math.floor(m/60)) + ':' + pad(m % 60);     // untuk input
const m2txt  = m => pad(Math.floor(m/60)) + '.' + pad(m % 60);     // untuk dibaca
const hhmm2m = v => { const [h, m] = String(v || '').split(':').map(Number); return Number.isFinite(h) && Number.isFinite(m) ? h*60 + m : null; };

const S = {
  data:null, cfg:null, lastStamp:null, lastChange:0,
  pending:null, estimate:null, usage:[], events:[], series:null,
  draft:null, brand:null, dirtyAuto:false, dirtyGap:false, dirtySched:false
};
const isOnline = () => S.lastChange && (Date.now() - S.lastChange < OFFLINE_MS);

// =====================================================================
// JADWAL (dihitung juga di web untuk tampilan)
// =====================================================================
function windows(c){
  if (!c) return [];
  const w = [[+c.sched1_start, +c.sched1_end]];
  if (c.sched2_enabled) w.push([+c.sched2_start, +c.sched2_end]);
  return w.filter(([s, e]) => Number.isFinite(s) && Number.isFinite(e) && s !== e);
}
function inWin(m, s, e){ return s < e ? (m >= s && m < e) : (m >= s || m < e); }
function nextOpen(c){
  const m = witaMinutes();
  let best = null;
  for (const [s] of windows(c)){
    const diff = (s - m + 1440) % 1440;
    if (best === null || diff < best.diff) best = {diff, s};
  }
  return best ? best.s : null;
}

function renderHome(){
  const d = S.data, c = S.cfg, online = isOnline();

  const pill = $('connPill');
  pill.className = 'pill ' + (!d ? 'wait' : online ? 'ok' : 'bad');
  $('connText').textContent = !d ? t('connecting') : online ? t('online') : t('offline');

  if (c) $('tankLabel').textContent = `${c.tank_brand || ''} ${c.tank_model || ''}, ${nf(c.capacity_liters)} L`;

  const valid = d && !d.sensor_error && d.level_percent != null;
  const pct = valid ? clamp(+d.level_percent, 0, 100) : null;
  const usable = valid && d.usable_liters ? +d.usable_liters : cfgUsable();
  const vol = valid ? +d.volume_liters : null;
  const panel = (d && online && d.panel_mode) || 'auto';
  const on = !!(d && d.pump_on);
  const filling = online && (on || panel === 'bypass');

  const water = $('water');
  water.style.height = (pct ?? 0) + '%';
  water.classList.toggle('empty', !pct || pct < 1);
  $('stream').style.bottom = (pct ?? 0) + '%';
  $('tankWrap').classList.toggle('filling', filling && on);
  $('pctBig').textContent = pct == null ? '—' : nf(pct) + '%';
  $('litersBig').textContent = vol == null ? '—' : nf(vol);
  $('ofCap').textContent = usable ? t('of_capacity', {cap: nf(usable)}) : '';
  $('barFill').style.width = (pct ?? 0) + '%';
  $('emptyL').textContent = vol == null ? '—' : nf(Math.max(0, usable - vol)) + ' L';
  $('levelCm').textContent = valid ? nf(d.level_cm, 1) + ' cm' : '—';
  $('lastSeen').textContent = S.lastChange ? new Date(S.lastChange).toLocaleTimeString('id-ID',{hour:'2-digit',minute:'2-digit',second:'2-digit'}) : '—';
  $('rssi').textContent = d && d.wifi_rssi != null ? d.wifi_rssi + ' dBm' : '—';

  const auto = c && c.mode === 'auto';
  for (const [id, val, key] of [['markStart', c && c.start_percent, 'mk_start'], ['markStop', c && c.stop_percent, 'mk_stop']]){
    const m = $(id);
    m.hidden = !auto;
    if (auto){ m.style.bottom = val + '%'; m.firstElementChild.textContent = t(key, {p: nf(val)}); }
  }

  let st = 'info', txt;
  if (!d) txt = t('waiting');
  else if (!online) { st = 'bad'; txt = t('device_offline'); }
  else if (d.sensor_error) { st = 'bad'; txt = t('sensor_err'); }
  else if (on) { st = 'info'; txt = t('status_filling'); }
  else if (c && pct >= Math.min(95, c.stop_percent)) { st = 'ok'; txt = t('status_full'); }
  else if (pct <= Math.max(15, c ? c.start_percent : 15)) { st = 'warn'; txt = t('status_low'); }
  else { st = 'ok'; txt = t('status_ok'); }
  const se = $('stateText'); se.className = 'state ' + (st === 'ok' ? '' : st); se.textContent = txt;
  $('estText').textContent = estimateText(online, d, vol);

  // pompa
  $('lamp').classList.toggle('on', on && online);
  $('pumpText').textContent = !d ? '—' : (panel === 'bypass' ? '🔧 ' + t('mode_manual') : on ? t('pump_on') : t('pump_off'));
  $('modeAuto').classList.toggle('active', !!auto);
  $('modeManual').classList.toggle('active', !!c && !auto);
  const u = cfgUsable();
  $('modeDesc').textContent = !c ? '' : auto
      ? t('mode_auto_desc', {start: nf(c.start_percent)+'% ('+nf(c.start_percent/100*u)+' L)', stop: nf(c.stop_percent)+'% ('+nf(c.stop_percent/100*u)+' L)'})
      : t('mode_manual_desc');
  const lock = !c || auto || !online || !!S.pending || panel !== 'auto';
  $('btnOn').disabled = lock || on;
  $('btnOff').disabled = lock || !on;

  // chip status jadwal & pengaman
  const chips = [];
  if (c){
    if (c.schedule_enabled){
      const list = windows(c).map(([s, e]) => m2txt(s) + '–' + m2txt(e)).join(', ');
      if (d && online && d.time_synced === false) chips.push(['warn', '⏰ ' + t('sched_nosync')]);
      else {
        const open = d && online ? d.sched_open !== false : windows(c).some(([s, e]) => inWin(witaMinutes(), s, e));
        if (open) chips.push(['ok', '⏰ ' + t('sched_now_open') + ' (' + list + ')']);
        else { const nx = nextOpen(c); chips.push(['warn', '⏰ ' + t('sched_now_closed', {t: nx == null ? '—' : m2txt(nx)})]); }
      }
    } else chips.push(['', '⏰ ' + t('sched_off')]);
    chips.push(['', '🛡️ ' + t('dry_chip', {m: c.dry_run_minutes})]);
  }
  $('pumpChips').innerHTML = chips.map(([k, s]) => `<span class="chipInfo ${k}">${s}</span>`).join('');

  // banner alarm & panel
  const alarm = d && online ? d.alarm : '';
  $('alarmBox').hidden = !alarm;
  if (alarm){
    $('alarmText').textContent = t('alarm_' + alarm);
    $('alarmReset').hidden = alarm === 'SENSOR';
  }
  $('panelBox').hidden = panel === 'auto';
  if (panel !== 'auto') $('panelText').textContent = t(panel === 'bypass' ? 'panel_bypass' : 'panel_off');
  if (panel !== 'auto' && c && !auto) note('cmdNote', t('panel_lock'));
  else if ($('cmdNote').textContent === t('panel_lock')) note('cmdNote', '');
}

function estimateText(online, d, vol){
  if (!online || !d || vol == null) return '—';
  if (d.pump_on) return t('est_filling');
  const e = S.estimate;
  if (!e || e.kind === 'unknown') return t('est_unknown');
  if (e.kind === 'long') return t('est_long');
  const h = vol / e.rate;
  if (h > 48) return t('est_long');
  if (h >= 24) return t('est_days', {d: nf(h/24, 1)});
  return t('est_hours', {h: nf(h, h < 10 ? 1 : 0)});
}

async function pollData(){
  try{
    const rows = await api(T_DATA + '?select=*&' + dev);
    const d = rows && rows[0];
    if (d){
      if (d.updated_at !== S.lastStamp){
        const first = S.lastStamp === null;
        S.lastStamp = d.updated_at;
        S.lastChange = first ? Math.min(Date.now(), Date.parse(d.updated_at)) : Date.now();
      }
      S.data = d;
      checkPending();
    }
  }catch(e){ console.warn('data:', e.message); }
  renderHome();
}

async function sendCommand(on){
  if (!S.cfg || S.cfg.mode !== 'manual'){ note('cmdNote', t('manual_only'), 'err'); return; }
  note('cmdNote', t('sending'));
  try{
    const seq = await api('rpc/tandon_send_command', {method:'POST', body:{p_device:DEVICE_ID, p_on:on}});
    S.pending = {seq:Number(seq), on, since:Date.now()};
    note('cmdNote', t('waiting_device'));
  }catch(e){
    S.pending = null;
    note('cmdNote', t('cmd_fail'), 'err');
  }
  renderHome();
}

function checkPending(){
  const p = S.pending;
  if (!p || !S.data) return;
  const applied = Number(S.data.applied_cmd_seq) >= p.seq;
  if (applied && (S.data.pump_on === p.on || Date.now() - p.since > 6000)){
    S.pending = null; note('cmdNote', '');
  } else if (Date.now() - p.since > 15000){
    S.pending = null; note('cmdNote', t('cmd_timeout'), 'err');
  }
}

async function setMode(mode){
  if (!S.cfg || S.cfg.mode === mode) return;
  const prev = S.cfg.mode;
  S.cfg.mode = mode; renderHome();
  try{
    await api(T_CFG + '?' + dev, {method:'PATCH', body:{mode}, prefer:'return=minimal'});
  }catch(e){
    S.cfg.mode = prev; toast(t('save_fail'), true); renderHome();
  }
}

async function resetAlarm(){
  try{
    await api('rpc/tandon_reset_alarm', {method:'POST', body:{p_device:DEVICE_ID}});
    toast(t('waiting_device'));
  }catch(e){ toast(t('save_fail'), true); }
}

async function loadConfig(force){
  try{
    const rows = await api(T_CFG + '?select=*&' + dev);
    if (!rows || !rows[0]) return;
    S.cfg = rows[0];
    if (force || !S.dirtyAuto) fillAuto();
    if (force || !S.dirtySched) fillSched();
    if (force || !S.dirtyGap) $('gapInput').value = S.cfg.full_gap_cm;
    if (!S.brand) S.brand = TANKS[S.cfg.tank_brand] ? S.cfg.tank_brand : CUSTOM;
    renderTankPage();
    renderHome();
  }catch(e){ console.warn('config:', e.message); }
}

// ---------- tandon ----------
function tankChoice(){
  if (S.draft) return S.draft;
  const c = S.cfg;
  return c ? {brand:c.tank_brand, model:c.tank_model, cap:+c.capacity_liters, height:+c.tank_height_cm} : null;
}

function renderTankPage(){
  const chips = $('brandChips'); chips.innerHTML = '';
  for (const b of [...Object.keys(TANKS), CUSTOM]){
    const el = document.createElement('button');
    el.className = 'chip' + (S.brand === b ? ' active' : '');
    el.textContent = b === CUSTOM ? t('tank_custom') : b;
    el.onclick = () => { S.brand = b; if (b === CUSTOM) updateCustomDraft(); renderTankPage(); };
    chips.appendChild(el);
  }
  const cur = tankChoice();
  const list = $('modelList'); list.innerHTML = '';
  $('customBox').hidden = S.brand !== CUSTOM;
  if (S.brand && S.brand !== CUSTOM){
    for (const [model, cap, h] of TANKS[S.brand]){
      const el = document.createElement('button');
      const active = cur && cur.brand === S.brand && cur.model === model;
      el.className = 'model' + (active ? ' active' : '');
      el.innerHTML = `<b>${model}</b><span>${nf(cap)} L, ${nf(h,1)} cm</span>`;
      el.onclick = () => { S.draft = {brand:S.brand, model, cap, height:h}; renderTankPage(); };
      list.appendChild(el);
    }
  } else if (S.brand === CUSTOM && cur && cur.brand === 'Custom'){
    if (!$('customCap').value) $('customCap').value = cur.cap;
    if (!$('customHeight').value) $('customHeight').value = cur.height;
  }
  const gap = +$('gapInput').value || 25;
  $('tankSummary').innerHTML = !cur ? '' :
    `<div><span>${t('sum_model')}</span><b>${cur.brand} ${cur.model}</b></div>
     <div><span>${t('sum_cap')}</span><b>${nf(cur.cap)} L</b></div>
     <div><span>${t('sum_height')}</span><b>${nf(cur.height,1)} cm</b></div>
     <div><span>${t('sum_usable')}</span><b>± ${nf(usableOf(cur.cap, cur.height, gap))} L</b></div>`;
}

function updateCustomDraft(){
  const cap = +$('customCap').value, h = +$('customHeight').value;
  S.draft = (cap > 0 && h > 0) ? {brand:'Custom', model:'Custom', cap, height:h} : null;
}

async function saveTank(){
  if (S.brand === CUSTOM) updateCustomDraft();
  const cur = tankChoice();
  const gap = +$('gapInput').value;
  if (!cur || !(cur.cap > 0) || !(cur.height > 40)){ toast(t('fill_tank'), true); return; }
  if (!(gap >= 20 && gap <= 60) || cur.height - gap < 20){ toast(t('gap_hint'), true); return; }
  try{
    await api(T_CFG + '?' + dev, {method:'PATCH', prefer:'return=minimal', body:{
      tank_brand:cur.brand, tank_model:cur.model, capacity_liters:cur.cap, tank_height_cm:cur.height, full_gap_cm:gap
    }});
    S.draft = null; S.dirtyGap = false;
    toast(t('saved'));
    await loadConfig(true);
  }catch(e){ toast(t('save_fail'), true); console.warn(e); }
}

// ---------- batas nyala/mati ----------
function fillAuto(){
  const c = S.cfg; if (!c) return;
  setThr('start', +c.start_percent);
  setThr('stop',  +c.stop_percent);
  $('dryMin').value = c.dry_run_minutes;
  S.dirtyAuto = false;
  drawPreview();
}
function setThr(kind, pct){
  const u = cfgUsable();
  $(kind+'Pct').value = Math.round(pct*10)/10;
  $(kind+'Range').value = pct;
  $(kind+'L').value = Math.round(pct/100*u);
}
function onThr(kind, src){
  const u = cfgUsable();
  let p;
  if (src === 'L'){
    p = u > 0 ? (+$(kind+'L').value) / u * 100 : 0;
    p = Math.round(p*10)/10;
    $(kind+'Pct').value = p; $(kind+'Range').value = p;
  } else {
    p = src === 'range' ? +$(kind+'Range').value : +$(kind+'Pct').value;
    if (src === 'range') $(kind+'Pct').value = p; else $(kind+'Range').value = p;
    $(kind+'L').value = Math.round(p/100*u);
  }
  S.dirtyAuto = true;
  drawPreview();
}
function drawPreview(){
  const s = clamp(+$('startPct').value || 0, 0, 100), e = clamp(+$('stopPct').value || 0, 0, 100);
  $('pvBand').style.left = s + '%';
  $('pvBand').style.width = Math.max(0, e - s) + '%';
  $('pvS').style.left = s + '%';
  $('pvE').style.left = e + '%';
  $('usableInfo').textContent = t('usable_info', {u: nf(cfgUsable())});
  $('pvText').textContent = e > s ? t('pv_text', {l: nf((e - s)/100*cfgUsable())}) : '';
}
async function saveAuto(){
  const s = +$('startPct').value, e = +$('stopPct').value, dry = Math.round(+$('dryMin').value);
  if (!(s >= 5 && s <= 90 && e >= 15 && e <= 95 && e - s >= 10)){ toast(t('threshold_err'), true); return; }
  if (!(dry >= 3 && dry <= 60)){ $('dryMin').value = clamp(dry || 10, 3, 60); return; }
  try{
    await api(T_CFG + '?' + dev, {method:'PATCH', prefer:'return=minimal',
      body:{start_percent:s, stop_percent:e, dry_run_minutes:dry}});
    S.dirtyAuto = false;
    toast(t('saved'));
    await loadConfig(true);
  }catch(err){ toast(t('save_fail'), true); console.warn(err); }
}

// ---------- jadwal ----------
function fillSched(){
  const c = S.cfg; if (!c || c.schedule_enabled === undefined) return;
  $('schedOn').checked = !!c.schedule_enabled;
  $('s1s').value = m2hhmm(+c.sched1_start); $('s1e').value = m2hhmm(+c.sched1_end);
  $('s2On').checked = !!c.sched2_enabled;
  $('s2s').value = m2hhmm(+c.sched2_start); $('s2e').value = m2hhmm(+c.sched2_end);
  $('schedFill').checked = !!c.schedule_fill;
  S.dirtySched = false;
  drawTimeline();
}
function readSchedForm(){
  return {
    schedule_enabled: $('schedOn').checked,
    sched1_start: hhmm2m($('s1s').value), sched1_end: hhmm2m($('s1e').value),
    sched2_enabled: $('s2On').checked,
    sched2_start: hhmm2m($('s2s').value), sched2_end: hhmm2m($('s2e').value),
    schedule_fill: $('schedFill').checked
  };
}
function drawTimeline(){
  const f = readSchedForm();
  $('schedBody').classList.toggle('disabled', !f.schedule_enabled);
  $('win2').classList.toggle('off', !f.sched2_enabled);
  const bars = [];
  const add = (s, e, cls) => {
    if (s == null || e == null || s === e) return;
    const seg = s < e ? [[s, e]] : [[s, 1440], [0, e]];
    for (const [a, b] of seg) bars.push(`<i class="${cls}" style="left:${a/14.4}%;width:${(b-a)/14.4}%"></i>`);
  };
  add(f.sched1_start, f.sched1_end, 'w1');
  if (f.sched2_enabled) add(f.sched2_start, f.sched2_end, 'w2');
  bars.push(`<span class="now" style="left:calc(${witaMinutes()/14.4}% - 1px)"></span>`);
  $('timeline').innerHTML = bars.join('');
}
async function saveSched(){
  const f = readSchedForm();
  if (f.sched1_start == null || f.sched1_end == null || f.sched1_start === f.sched1_end ||
      (f.sched2_enabled && (f.sched2_start == null || f.sched2_end == null || f.sched2_start === f.sched2_end))){
    toast(t('sched_invalid'), true); return;
  }
  try{
    await api(T_CFG + '?' + dev, {method:'PATCH', prefer:'return=minimal', body:f});
    S.dirtySched = false;
    toast(t('saved'));
    await loadConfig(true);
  }catch(e){ toast(t('save_fail'), true); console.warn(e); }
}

// =====================================================================
// PERKIRAAN AIR HABIS (dari pemakaian 6 jam terakhir)
// =====================================================================
async function loadEstimate(){
  try{
    const since = new Date(Date.now() - 6*3600e3).toISOString();
    const rows = await api(`${T_HIST}?select=created_at,volume_liters,sensor_error&${dev}&created_at=gte.${encodeURIComponent(since)}&order=created_at.asc&limit=1000`);
    const pts = (rows || []).filter(r => !r.sensor_error && Number.isFinite(+r.volume_liters));
    if (pts.length < 20){ S.estimate = {kind:'unknown'}; return; }
    const B = new Map();
    for (const r of pts){
      const k = Math.floor(Date.parse(r.created_at) / 600000);
      const b = B.get(k) || {s:0, n:0}; b.s += +r.volume_liters; b.n++; B.set(k, b);
    }
    const keys = [...B.keys()].sort((a,b) => a - b);
    const dead = Math.max(3, cfgUsable() * 0.005);
    let used = 0;
    for (let i = 1; i < keys.length; i++){
      if (keys[i] - keys[i-1] > 3) continue;
      const a = B.get(keys[i-1]), b = B.get(keys[i]);
      const diff = a.s/a.n - b.s/b.n;
      if (diff > dead) used += diff;
    }
    const hours = (Date.parse(pts[pts.length-1].created_at) - Date.parse(pts[0].created_at)) / 3600e3;
    const rate = hours > 0.5 ? used / hours : 0;
    S.estimate = rate < 1 ? {kind:'long'} : {kind:'rate', rate};
  }catch(e){ console.warn('estimate:', e.message); }
  renderHome();
}

async function loadHistory(){
  try{
    const [usage, events] = await Promise.all([
      api('rpc/tandon_usage_daily', {method:'POST', body:{p_device:DEVICE_ID, p_days:31}}),
      api(`${T_EV}?select=created_at,type,reason,level_percent&${dev}&order=created_at.desc&limit=15`)
    ]);
    S.usage = usage || []; S.events = events || [];
  }catch(e){ console.warn('history:', e.message); }
  renderHistory();
}
async function loadSeries(){
  try{
    S.series = await api('rpc/tandon_level_series', {method:'POST', body:{p_device:DEVICE_ID, p_hours:24}}) || [];
  }catch(e){ console.warn('series:', e.message); S.series = S.series || []; }
  renderLineChart();
}

function renderHistory(){
  const byDay = new Map(S.usage.map(r => [r.day, r]));
  const today = witaDate(new Date());
  const base = new Date(today + 'T12:00:00Z');
  const days = [];
  for (let i = 6; i >= 0; i--){
    const dt = new Date(base.getTime() - i*86400e3);
    days.push({key: dt.toISOString().slice(0,10), dow: dt.getUTCDay()});
  }
  const sum = rows => rows.reduce((a, r) => ({
    used: a.used + (+r.used_liters || 0), min: a.min + (+r.pump_minutes || 0), n: a.n + (+r.pump_starts || 0)
  }), {used:0, min:0, n:0});
  const rToday = sum(S.usage.filter(r => r.day === today));
  const rWeek  = sum(S.usage.filter(r => r.day >= days[0].key));
  const rMonth = sum(S.usage.filter(r => r.day.slice(0,7) === today.slice(0,7)));

  for (const [id, r] of [['Today', rToday], ['Week', rWeek], ['Month', rMonth]]){
    $('u'+id).textContent = nf(r.used) + ' L';
    $('s'+id).textContent = t('pump_summary', {n: nf(r.n), m: fmtDuration(r.min)});
  }
  $('tdUsed').textContent = nf(rToday.used) + ' L';
  $('tdStarts').textContent = nf(rToday.n) + '×';
  $('tdDur').textContent = fmtDuration(rToday.min);

  const names = t('days');
  const max = Math.max(1, ...days.map(d => +(byDay.get(d.key)?.used_liters || 0)));
  $('chart').innerHTML = days.map(d => {
    const v = +(byDay.get(d.key)?.used_liters || 0);
    return `<div class="col${d.key === today ? ' today' : ''}"><b>${v ? nf(v) : ''}</b><i style="height:${Math.max(2, v/max*100)}%"></i><span>${names[d.dow]}</span></div>`;
  }).join('');

  const icons = {PUMP_ON:'▶️',PUMP_OFF:'⏹',DRY_RUN:'⚠️',SENSOR_ERROR:'⚠️',SENSOR_OK:'✅',OVERFLOW_STOP:'🛑',LOW_WATER:'💧',BOOT:'🔌',
                 PANEL_AUTO:'✅',PANEL_OFF:'⏸',PANEL_BYPASS:'🔧',BYPASS_FULL:'🚨'};
  const ul = $('events');
  if (!S.events.length){ ul.innerHTML = `<li><span class="et">${t('no_data')}</span></li>`; return; }
  ul.innerHTML = S.events.map(e => {
    const when = new Date(e.created_at).toLocaleString('id-ID',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'});
    const sub = [e.reason ? t('r_'+e.reason) : '', e.level_percent != null ? nf(e.level_percent)+'%' : ''].filter(Boolean).join(', ');
    return `<li><span class="ei">${icons[e.type] || '•'}</span><span class="et">${t('ev_'+e.type)}<small>${sub}</small></span><time>${when}</time></li>`;
  }).join('');
}

function renderLineChart(){
  const box = $('lineChart');
  const rows = (S.series || []).map(r => ({t: Date.parse(r.t), l: +r.level, p: +r.pump})).filter(r => Number.isFinite(r.t) && Number.isFinite(r.l));
  if (!rows.length){ box.innerHTML = `<p class="muted">${t('no_data')}</p>`; return; }
  const W = 720, H = 230, L = 36, R = 12, T = 12, B = 28;
  const t1 = Date.now(), t0 = t1 - 24*3600e3;
  const x = v => L + (v - t0) / (t1 - t0) * (W - L - R);
  const y = p => T + (1 - p/100) * (H - T - B);
  const step = 600000, bw = Math.max(1, x(t0 + step) - x(t0));
  let svg = '';
  for (const r of rows) if (r.p >= 0.5) svg += `<rect class="lc-pump" x="${x(r.t).toFixed(1)}" y="${T}" width="${bw.toFixed(1)}" height="${H-T-B}"/>`;
  for (const p of [0, 25, 50, 75, 100]) svg += `<line class="lc-grid" x1="${L}" x2="${W-R}" y1="${y(p)}" y2="${y(p)}"/><text class="lc-lab" x="${L-6}" y="${y(p)+4}" text-anchor="end">${p}</text>`;
  if (S.cfg){
    svg += `<line class="lc-start" x1="${L}" x2="${W-R}" y1="${y(+S.cfg.start_percent)}" y2="${y(+S.cfg.start_percent)}"/>`;
    svg += `<line class="lc-stop" x1="${L}" x2="${W-R}" y1="${y(+S.cfg.stop_percent)}" y2="${y(+S.cfg.stop_percent)}"/>`;
  }
  // garis isi tandon, diputus jika data kosong > 30 menit
  const segs = []; let cur = [];
  for (const r of rows){
    if (cur.length && r.t - cur[cur.length-1].t > 1800000){ segs.push(cur); cur = []; }
    cur.push(r);
  }
  if (cur.length) segs.push(cur);
  for (const sg of segs){
    const pts = sg.map(r => `${(x(r.t) + bw/2).toFixed(1)},${y(r.l).toFixed(1)}`);
    const x0 = (x(sg[0].t) + bw/2).toFixed(1), x1 = (x(sg[sg.length-1].t) + bw/2).toFixed(1);
    svg += `<path class="lc-area" d="M${x0},${y(0)} L${pts.join(' L')} L${x1},${y(0)} Z"/>`;
    svg += `<path class="lc-line" d="M${pts.join(' L')}"/>`;
  }
  for (let i = 0; i <= 4; i++){
    const tt = t0 + i * 6 * 3600e3;
    const lab = new Date(tt).toLocaleTimeString('id-ID',{timeZone:'Asia/Makassar',hour:'2-digit',minute:'2-digit'});
    svg += `<text class="lc-lab" x="${x(tt)}" y="${H-8}" text-anchor="${i === 0 ? 'start' : i === 4 ? 'end' : 'middle'}">${lab}</text>`;
  }
  box.innerHTML = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${t('chart_24h')}">${svg}</svg>`;
}

// =====================================================================
// BAHASA
// =====================================================================
function renderLangs(){
  for (const g of ['regional', 'national']){
    const box = $(g === 'regional' ? 'langRegional' : 'langNational');
    box.innerHTML = '';
    for (const l of LANGS.filter(x => x.group === g)){
      const b = document.createElement('button');
      b.className = 'lang' + (l.code === LANG ? ' active' : '');
      b.innerHTML = `<b>${l.name}</b><span>${l.region}</span>`;
      b.onclick = () => setLang(l.code);
      box.appendChild(b);
    }
  }
}
function setLang(code){
  LANG = code;
  try { localStorage.setItem('tandonLang', code); } catch(e) {}
  document.documentElement.lang = code;
  document.querySelectorAll('[data-i18n]').forEach(n => n.textContent = t(n.dataset.i18n));
  $('themeBtn').title = t('theme'); $('themeBtn').setAttribute('aria-label', t('theme'));
  renderLangs(); renderHome(); renderTankPage(); drawPreview(); renderHistory(); renderLineChart();
}

function tickClock(){
  $('clock').textContent = new Date().toLocaleTimeString('id-ID',{timeZone:'Asia/Makassar',hour:'2-digit',minute:'2-digit'}) + ' WITA';
}

// =====================================================================
// NAVIGASI & EVENT
// =====================================================================
document.querySelectorAll('#tabs button').forEach(b => b.onclick = () => {
  document.querySelectorAll('#tabs button').forEach(x => x.classList.toggle('active', x === b));
  document.querySelectorAll('.page').forEach(p => p.classList.toggle('active', p.id === 'pg-' + b.dataset.page));
  if (b.dataset.page === 'history'){ loadHistory(); loadSeries(); }
  if (b.dataset.page === 'pump') drawTimeline();
  window.scrollTo(0, 0);
});

$('btnOn').onclick  = () => sendCommand(true);
$('btnOff').onclick = () => sendCommand(false);
$('modeAuto').onclick   = () => setMode('auto');
$('modeManual').onclick = () => setMode('manual');
$('alarmReset').onclick = resetAlarm;
$('saveTank').onclick  = saveTank;
$('saveAuto').onclick  = saveAuto;
$('saveSched').onclick = saveSched;
$('themeBtn').onclick = () => {
  THEME = (document.documentElement.dataset.theme === 'light') ? 'dark' : 'light';
  try { localStorage.setItem('tandonTheme', THEME); } catch(e) {}
  applyTheme();
};
$('gapInput').oninput = () => { S.dirtyGap = true; renderTankPage(); };
$('customCap').oninput = $('customHeight').oninput = () => { updateCustomDraft(); renderTankPage(); };
for (const k of ['start', 'stop']){
  $(k+'Pct').oninput   = () => onThr(k, 'pct');
  $(k+'L').oninput     = () => onThr(k, 'L');
  $(k+'Range').oninput = () => onThr(k, 'range');
}
$('dryMin').oninput = () => { S.dirtyAuto = true; };
for (const id of ['schedOn','s1s','s1e','s2On','s2s','s2e','schedFill'])
  $(id).addEventListener('input', () => { S.dirtySched = true; drawTimeline(); });

// =====================================================================
// MULAI
// =====================================================================
applyTheme();
matchMedia('(prefers-color-scheme: light)').addEventListener('change', () => { if (!THEME) applyTheme(); });
setLang(LANG);
tickClock();
loadConfig(true).then(() => { loadEstimate(); loadHistory(); loadSeries(); });
pollData();
setInterval(pollData, 1500);
setInterval(() => loadConfig(false), 15000);
setInterval(loadEstimate, 60000);
setInterval(loadHistory, 60000);
setInterval(() => { if ($('pg-history').classList.contains('active')) loadSeries(); }, 120000);
setInterval(() => { tickClock(); renderHome(); drawTimeline(); }, 5000);
</script>
